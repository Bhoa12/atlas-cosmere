name: Hoid verified answer presentation authority

on:
  push:
    branches:
      - "feat/hoid-ia-core-run*"
    paths:
      - "src/hoid/verifiedAnswerPresentation.ts"
      - "src/hoid/verifiedAnswerPresentation.test.ts"
      - "src/hoid/answerPresentation.ts"
      - "src/hoid/answerPresentation.test.ts"
      - "src/hoid/cursorProgressFingerprint.ts"
      - "src/hoid/cursorProgressFingerprint.test.ts"
      - "src/hoid/cursorEvidenceRuntime.ts"
      - "src/hoid/cursorEvidenceRuntime.test.ts"
      - "src/hoid/knowledgeGraph.ts"
      - "src/hoid/sha256.ts"
      - "src/hoid/approvedClaimIntegrity.ts"
      - "src/hoid/approvedClaimIntegrity.test.ts"
      - "src/hoid/evidenceScope.ts"
      - "src/hoid/readingManifest.ts"
      - "src/hoid/verifiedChapterDocuments.ts"
      - "src/hoid/SAFE_RESPONSE_INTEGRATION.md"
      - "src/hoid/VERIFIED_ANSWER_PRESENTATION.md"
      - "docs/hoid/RUN195_VERIFIED_ANSWER_PRESENTATION.md"
      - "docs/hoid/CURSOR_ANSWER_PROGRESS_BINDING.md"
      - ".github/workflows/hoid-verified-answer-presentation.yml"
  pull_request:
    paths:
      - "src/hoid/verifiedAnswerPresentation.ts"
      - "src/hoid/verifiedAnswerPresentation.test.ts"
      - "src/hoid/answerPresentation.ts"
      - "src/hoid/answerPresentation.test.ts"
      - "src/hoid/cursorProgressFingerprint.ts"
      - "src/hoid/cursorProgressFingerprint.test.ts"
      - "src/hoid/cursorEvidenceRuntime.ts"
      - "src/hoid/cursorEvidenceRuntime.test.ts"
      - "src/hoid/knowledgeGraph.ts"
      - "src/hoid/sha256.ts"
      - "src/hoid/approvedClaimIntegrity.ts"
      - "src/hoid/approvedClaimIntegrity.test.ts"
      - "src/hoid/evidenceScope.ts"
      - "src/hoid/readingManifest.ts"
      - "src/hoid/verifiedChapterDocuments.ts"
      - "src/hoid/SAFE_RESPONSE_INTEGRATION.md"
      - "src/hoid/VERIFIED_ANSWER_PRESENTATION.md"
      - "docs/hoid/RUN195_VERIFIED_ANSWER_PRESENTATION.md"
      - "docs/hoid/CURSOR_ANSWER_PROGRESS_BINDING.md"
      - ".github/workflows/hoid-verified-answer-presentation.yml"

permissions:
  contents: read

jobs:
  verified-answer-presentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test verified presentation authority
        run: npx vitest run src/hoid/verifiedAnswerPresentation.test.ts src/hoid/answerPresentation.test.ts src/hoid/approvedClaimIntegrity.test.ts src/hoid/cursorProgressFingerprint.test.ts src/hoid/cursorEvidenceRuntime.test.ts
      - name: Type-check verified presentation boundary
        run: npx tsc --noEmit --strict --target ES2020 --module commonjs --moduleResolution node --skipLibCheck src/hoid/verifiedAnswerPresentation.ts src/hoid/cursorEvidenceRuntime.ts src/hoid/cursorProgressFingerprint.ts src/hoid/knowledgeGraph.ts
