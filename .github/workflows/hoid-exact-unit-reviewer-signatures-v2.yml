name: Hoid exact-unit reviewer signatures v2

on:
  pull_request:
    paths:
      - "src/hoid/exactUnitClaimSignatures.ts"
      - "src/hoid/exactUnitClaimSignatures.test.ts"
      - "src/hoid/exactUnitClaimIntegrity.ts"
      - "src/hoid/editorialReviewSignatures.ts"
      - "src/hoid/exactUnitEvidenceRuntime.ts"
      - "src/hoid/unitEvidenceAuthorizationV2.ts"
      - "docs/hoid/RUN290_EXACT_UNIT_REVIEWER_SIGNATURES.md"
      - ".github/workflows/hoid-exact-unit-reviewer-signatures-v2.yml"
  push:
    branches:
      - "feat/hoid-ia-core-run290"
    paths:
      - "src/hoid/exactUnitClaimSignatures.ts"
      - "src/hoid/exactUnitClaimSignatures.test.ts"
      - "src/hoid/exactUnitClaimIntegrity.ts"
      - "src/hoid/editorialReviewSignatures.ts"
      - "src/hoid/exactUnitEvidenceRuntime.ts"
      - "src/hoid/unitEvidenceAuthorizationV2.ts"
      - "docs/hoid/RUN290_EXACT_UNIT_REVIEWER_SIGNATURES.md"
      - ".github/workflows/hoid-exact-unit-reviewer-signatures-v2.yml"

permissions:
  contents: read

jobs:
  exact-unit-reviewer-signatures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify exact-unit reviewer signatures and regressions
        run: >-
          npx vitest run
          src/hoid/exactUnitClaimSignatures.test.ts
          src/hoid/exactUnitClaimIntegrity.test.ts
          src/hoid/editorialReviewSignatures.test.ts
          src/hoid/exactUnitEvidenceRuntime.test.ts
      - name: Strict type-check
        run: >-
          npx tsc --noEmit --strict
          --target ES2022
          --module commonjs
          --moduleResolution node
          --lib ES2022,DOM
          --skipLibCheck
          src/hoid/exactUnitClaimSignatures.ts
          src/hoid/exactUnitClaimSignatures.test.ts
          src/hoid/exactUnitClaimIntegrity.ts
          src/hoid/editorialReviewSignatures.ts
          src/hoid/exactUnitEvidenceRuntime.ts
          src/hoid/unitEvidenceAuthorizationV2.ts
          src/hoid/unitProgressCoordinator.ts
          src/hoid/unitProgressLedger.ts
          src/hoid/unitProgressCursor.ts
          src/hoid/chapterReference.ts
          src/hoid/readingManifest.ts
          src/hoid/verifiedChapterDocuments.ts
          src/hoid/knowledgeKinds.ts
          src/hoid/sha256.ts
