name: Hoid catalog evidence unlock boundary

on:
  push:
    branches:
      - "feat/hoid-ia-core-run*"
    paths:
      - "src/hoid/catalog.ts"
      - "src/hoid/types.ts"
      - "src/hoid/spoilerGuard.ts"
      - "src/hoid/contextPolicy.ts"
      - "src/hoid/authorizedKnowledgeContext.ts"
      - "src/hoid/catalogEvidenceUnlock.test.ts"
      - "src/hoid/catalogTrustBoundary.test.ts"
      - "src/hoid/catalogValidation.ts"
      - "src/hoid/catalogValidation.test.ts"
      - "src/hoid/HoidService.ts"
      - "src/hoid/HoidServiceCatalogBoundary.test.ts"
      - "src/hoid/providerRequestSnapshot.ts"
      - "src/hoid/readingValidation.ts"
      - "src/hoid/evidenceScope.ts"
      - "src/hoid/readingContext.ts"
      - "src/hoid/editionProgressValidation.ts"
      - "src/hoid/readingManifest.ts"
      - "src/hoid/verifiedChapterLocators.ts"
      - "docs/hoid/CATALOG_EVIDENCE_UNLOCK_BOUNDARY.md"
      - "docs/hoid/RUN207_CATALOG_SNAPSHOT_ISOLATION.md"
      - "src/hoid/PROVIDER_BOUNDARY.md"
      - ".github/workflows/hoid-catalog-evidence-unlock.yml"
  pull_request:
    paths:
      - "src/hoid/catalog.ts"
      - "src/hoid/catalogValidation.ts"
      - "src/hoid/catalogValidation.test.ts"
      - "src/hoid/contextPolicy.ts"
      - "src/hoid/authorizedKnowledgeContext.ts"
      - "src/hoid/catalogEvidenceUnlock.test.ts"
      - "src/hoid/catalogTrustBoundary.test.ts"
      - "src/hoid/HoidService.ts"
      - "src/hoid/HoidServiceCatalogBoundary.test.ts"
      - "src/hoid/providerRequestSnapshot.ts"
      - "src/hoid/readingValidation.ts"
      - "src/hoid/evidenceScope.ts"
      - "src/hoid/readingContext.ts"
      - "src/hoid/editionProgressValidation.ts"
      - "src/hoid/readingManifest.ts"
      - "src/hoid/verifiedChapterLocators.ts"
      - "docs/hoid/CATALOG_EVIDENCE_UNLOCK_BOUNDARY.md"
      - "docs/hoid/RUN207_CATALOG_SNAPSHOT_ISOLATION.md"
      - "src/hoid/PROVIDER_BOUNDARY.md"
      - ".github/workflows/hoid-catalog-evidence-unlock.yml"

permissions:
  contents: read

jobs:
  catalog-evidence-unlock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test catalog mention, summary and snapshot boundaries
        run: >-
          npx vitest run
          src/hoid/catalogEvidenceUnlock.test.ts
          src/hoid/catalogTrustBoundary.test.ts
          src/hoid/catalogValidation.test.ts
          src/hoid/evidenceScope.test.ts
          src/hoid/HoidServiceCatalogBoundary.test.ts
      - name: Type-check provider-facing catalog boundary
        run: >-
          npx tsc --noEmit --strict --target ES2020
          --module commonjs --moduleResolution node --skipLibCheck
          src/hoid/catalog.ts
          src/hoid/catalogValidation.ts
          src/hoid/types.ts
          src/hoid/spoilerGuard.ts
          src/hoid/contextPolicy.ts
          src/hoid/authorizedKnowledgeContext.ts
          src/hoid/HoidService.ts
          src/hoid/providerRequestSnapshot.ts
          src/hoid/readingValidation.ts
          src/hoid/evidenceScope.ts
          src/hoid/readingContext.ts
          src/hoid/editionProgressValidation.ts
          src/hoid/readingManifest.ts
          src/hoid/verifiedChapterLocators.ts
          src/hoid/catalogEvidenceUnlock.test.ts
          src/hoid/catalogTrustBoundary.test.ts
          src/hoid/HoidServiceCatalogBoundary.test.ts
