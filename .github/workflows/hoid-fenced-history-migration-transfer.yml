name: Hoid fenced canonical history migration transfer

on:
  push:
    branches:
      - "feat/hoid-ia-core-run307"
    paths:
      - "src/hoid/conversationHistoryMigrationSnapshotPort.ts"
      - "src/hoid/conversationHistoryMigrationTransferAdapter.ts"
      - "src/hoid/conversationHistoryMigrationTransferAdapter.test.ts"
      - "src/hoid/conversationVaultGenerationFence.ts"
      - "src/hoid/conversationVaultGenerationFence.test.ts"
      - "src/hoid/expoSqliteConversationHistoryGenerationFence.ts"
      - "src/hoid/expoSqliteConversationHistoryGenerationFence.test.ts"
      - "src/hoid/conversationHistoryMigrationRunner.ts"
      - "src/hoid/conversationHistorySnapshotCodec.ts"
      - "src/hoid/conversationHistoryHydration.ts"
      - "src/hoid/conversationHistoryPolicy.ts"
      - "src/hoid/conversationVault.ts"
      - "src/hoid/conversationHistoryStorePort.ts"
      - "src/hoid/expoSqliteConversationHistoryStore.ts"
      - "src/hoid/sqliteProgressStore.ts"
      - "src/hoid/sha256.ts"
      - "docs/hoid/RUN307_FENCED_MIGRATION_TRANSFER.md"
      - ".github/workflows/hoid-fenced-history-migration-transfer.yml"
  pull_request:
    paths:
      - "src/hoid/conversationHistoryMigrationSnapshotPort.ts"
      - "src/hoid/conversationHistoryMigrationTransferAdapter.ts"
      - "src/hoid/conversationHistoryMigrationTransferAdapter.test.ts"
      - "src/hoid/conversationVaultGenerationFence.ts"
      - "src/hoid/conversationVaultGenerationFence.test.ts"
      - "src/hoid/expoSqliteConversationHistoryGenerationFence.ts"
      - "src/hoid/expoSqliteConversationHistoryGenerationFence.test.ts"
      - "src/hoid/conversationHistoryMigrationRunner.ts"
      - "src/hoid/conversationHistorySnapshotCodec.ts"
      - "src/hoid/conversationHistoryHydration.ts"
      - "src/hoid/conversationHistoryPolicy.ts"
      - "src/hoid/conversationVault.ts"
      - "src/hoid/conversationHistoryStorePort.ts"
      - "src/hoid/expoSqliteConversationHistoryStore.ts"
      - "src/hoid/sqliteProgressStore.ts"
      - "src/hoid/sha256.ts"
      - "docs/hoid/RUN307_FENCED_MIGRATION_TRANSFER.md"
      - ".github/workflows/hoid-fenced-history-migration-transfer.yml"

permissions:
  contents: read

jobs:
  fenced-history-transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test migration transfer and storage fences
        run: >-
          npx vitest run
          src/hoid/conversationHistoryMigrationTransferAdapter.test.ts
          src/hoid/conversationVaultGenerationFence.test.ts
          src/hoid/expoSqliteConversationHistoryGenerationFence.test.ts
          src/hoid/conversationHistoryMigrationRunner.test.ts
          src/hoid/conversationHistorySnapshotCodec.test.ts
          src/hoid/conversationHistoryHydration.test.ts
      - name: Type-check migration transfer and storage fences
        run: >-
          npx tsc --noEmit --strict --target ES2020 --module commonjs
          --moduleResolution node --esModuleInterop --skipLibCheck
          src/hoid/conversationHistoryMigrationSnapshotPort.ts
          src/hoid/conversationHistoryMigrationTransferAdapter.ts
          src/hoid/conversationHistoryMigrationTransferAdapter.test.ts
          src/hoid/conversationVaultGenerationFence.ts
          src/hoid/conversationVaultGenerationFence.test.ts
          src/hoid/expoSqliteConversationHistoryGenerationFence.ts
          src/hoid/expoSqliteConversationHistoryGenerationFence.test.ts
          src/hoid/conversationHistoryMigrationRunner.ts
          src/hoid/conversationHistorySnapshotCodec.ts
          src/hoid/conversationHistoryHydration.ts
          src/hoid/conversationHistoryPolicy.ts
          src/hoid/conversationVault.ts
          src/hoid/conversationHistoryStorePort.ts
          src/hoid/expoSqliteConversationHistoryStore.ts
          src/hoid/sqliteProgressStore.ts
          src/hoid/sha256.ts
