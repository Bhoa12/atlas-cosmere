name: Hoid Run 359 — evidence-linked investigation context

on:
  push:
    branches:
      - "feat/hoid-ia-core-run359"
    paths:
      - "src/hoid/investigationIdentity.ts"
      - "src/hoid/investigationIdentity.test.ts"
      - "src/hoid/investigationSession.ts"
      - "src/hoid/investigationSession.test.ts"
      - "src/hoid/knowledgeGraph.ts"
      - "src/hoid/knowledgeGraph.test.ts"
      - "src/hoid/investigationContext.ts"
      - "src/hoid/investigationContext.test.ts"
      - "docs/hoid/RUN359_EVIDENCE_LINKED_INVESTIGATION_CONTEXT.md"
      - ".github/workflows/hoid-run359-evidence-linked-investigation-context.yml"
  pull_request:
    paths:
      - "src/hoid/investigationIdentity.ts"
      - "src/hoid/investigationIdentity.test.ts"
      - "src/hoid/investigationSession.ts"
      - "src/hoid/investigationSession.test.ts"
      - "src/hoid/knowledgeGraph.ts"
      - "src/hoid/knowledgeGraph.test.ts"
      - "src/hoid/investigationContext.ts"
      - "src/hoid/investigationContext.test.ts"
      - "docs/hoid/RUN359_EVIDENCE_LINKED_INVESTIGATION_CONTEXT.md"
      - ".github/workflows/hoid-run359-evidence-linked-investigation-context.yml"

permissions:
  contents: read

jobs:
  evidence-linked-context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run context, graph and session regression suites
        run: >-
          npx vitest run
          src/hoid/investigationIdentity.test.ts
          src/hoid/investigationSession.test.ts
          src/hoid/knowledgeGraph.test.ts
          src/hoid/investigationContext.test.ts
          src/hoid/entityDossierConversation.test.ts
          src/hoid/entityRelationshipConversation.test.ts
          src/hoid/entityProgressTimeline.test.ts
          src/hoid/answerDisplayProjection.test.ts
      - name: Strict TypeScript check
        run: >-
          npx tsc --noEmit --strict
          --target ES2020
          --module commonjs
          --moduleResolution node
          --skipLibCheck
          --esModuleInterop
          --jsx react-native
          src/hoid/investigationIdentity.ts
          src/hoid/investigationIdentity.test.ts
          src/hoid/investigationSession.ts
          src/hoid/investigationSession.test.ts
          src/hoid/knowledgeGraph.ts
          src/hoid/knowledgeGraph.test.ts
          src/hoid/investigationContext.ts
          src/hoid/investigationContext.test.ts
          src/screens/HoidScreen.tsx
