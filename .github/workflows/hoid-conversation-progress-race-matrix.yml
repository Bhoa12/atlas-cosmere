name: Hoid conversation progress race matrix

on:
  push:
    branches:
      - "feat/hoid-ia-core-run*"
    paths:
      - "src/hoid/conversationGateway.ts"
      - "src/hoid/cursorProgressCoordinator.ts"
      - "src/hoid/cursorProgressCoordinator.test.ts"
      - "src/context/CosmereContext.tsx"
      - "src/hoid/progressChangeWatch.ts"
      - "src/hoid/conversationGateway.test.ts"
      - "src/hoid/conversationGatewayProgressRace.test.ts"
      - "src/hoid/cursorProgressFingerprint.ts"
      - "src/hoid/typedConversationContext.ts"
      - "src/hoid/conversationContext.ts"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/RUN248_PROGRESS_RACE_MATRIX.md"
      - "docs/hoid/RUN249_PROGRESS_CHANGE_SUBSCRIPTION.md"
      - ".github/workflows/hoid-conversation-progress-race-matrix.yml"
  pull_request:
    paths:
      - "src/hoid/conversationGateway.ts"
      - "src/hoid/cursorProgressCoordinator.ts"
      - "src/hoid/cursorProgressCoordinator.test.ts"
      - "src/context/CosmereContext.tsx"
      - "src/hoid/progressChangeWatch.ts"
      - "src/hoid/conversationGateway.test.ts"
      - "src/hoid/conversationGatewayProgressRace.test.ts"
      - "src/hoid/cursorProgressFingerprint.ts"
      - "src/hoid/typedConversationContext.ts"
      - "src/hoid/conversationContext.ts"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/RUN248_PROGRESS_RACE_MATRIX.md"
      - "docs/hoid/RUN249_PROGRESS_CHANGE_SUBSCRIPTION.md"
      - ".github/workflows/hoid-conversation-progress-race-matrix.yml"

permissions:
  contents: read

jobs:
  progress-race-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test progress races across conversational routes
        run: >-
          npx vitest run
          src/hoid/conversationGatewayProgressRace.test.ts
          src/hoid/cursorProgressCoordinator.test.ts
          src/hoid/conversationGateway.test.ts
      - name: Type-check progress and conversation boundaries
        run: >-
          npx tsc --noEmit --strict --target ES2020 --module commonjs
          --moduleResolution node --skipLibCheck --jsx react --esModuleInterop
          src/hoid/progressChangeWatch.ts
          src/hoid/cursorProgressFingerprint.ts
          src/hoid/typedConversationContext.ts
          src/hoid/conversationContext.ts
          src/hoid/conversationGateway.ts
          src/hoid/cursorProgressCoordinator.ts
          src/context/CosmereContext.tsx
          src/hoid/conversationGatewayProgressRace.test.ts
          src/hoid/conversationGateway.test.ts
          src/screens/HoidScreen.tsx
