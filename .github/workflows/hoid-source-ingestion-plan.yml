name: Hoid source ingestion plan

on:
  push:
    branches:
      - "feat/hoid-ia-core-run*"
    paths:
      - "src/hoid/sourceIngestionPlan.ts"
      - "src/hoid/sourceIngestionPlan.test.ts"
      - "src/hoid/sourceIngestionExecution.ts"
      - "src/hoid/sourceIngestionExecution.test.ts"
      - "src/hoid/sourceCoverage.ts"
      - "src/hoid/bibliography.ts"
      - "src/hoid/editionStructure.ts"
      - "src/hoid/readingManifest.ts"
      - "src/hoid/verifiedChapterDocuments.ts"
      - "src/hoid/verifiedChapterLocators.ts"
      - "docs/hoid/SOURCE_INGESTION_PLAN.md"
      - ".github/workflows/hoid-source-ingestion-plan.yml"
  pull_request:
    paths:
      - "src/hoid/sourceIngestionPlan.ts"
      - "src/hoid/sourceIngestionPlan.test.ts"
      - "src/hoid/sourceIngestionExecution.ts"
      - "src/hoid/sourceIngestionExecution.test.ts"
      - "src/hoid/sourceCoverage.ts"
      - "src/hoid/bibliography.ts"
      - "src/hoid/editionStructure.ts"
      - "src/hoid/readingManifest.ts"
      - "src/hoid/verifiedChapterDocuments.ts"
      - "src/hoid/verifiedChapterLocators.ts"
      - "docs/hoid/SOURCE_INGESTION_PLAN.md"
      - ".github/workflows/hoid-source-ingestion-plan.yml"

permissions:
  contents: read

jobs:
  source-ingestion-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test metadata-only ingestion plan and source boundaries
        run: >-
          npx vitest run
          src/hoid/sourceIngestionPlan.test.ts
          src/hoid/sourceIngestionExecution.test.ts
          src/hoid/sourceCoverage.test.ts
          src/hoid/verifiedChapterDocuments.test.ts
          src/hoid/verifiedChapterLocators.test.ts
          src/hoid/readingManifest.test.ts
          src/hoid/editorialDrafts.test.ts
          src/hoid/editorialRegistry.test.ts
      - name: Type-check ingestion planning boundaries
        run: >-
          npx tsc --noEmit --strict --target ES2020 --module commonjs
          --moduleResolution node --skipLibCheck
          src/hoid/sourceIngestionPlan.ts
          src/hoid/sourceIngestionExecution.ts
          src/hoid/sourceCoverage.ts
          src/hoid/bibliography.ts
          src/hoid/editionStructure.ts
          src/hoid/readingManifest.ts
          src/hoid/verifiedChapterDocuments.ts
          src/hoid/verifiedChapterLocators.ts
          src/hoid/editorialDrafts.ts
          src/hoid/editorialRegistry.ts
