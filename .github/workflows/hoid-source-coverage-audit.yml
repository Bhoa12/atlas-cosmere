name: Hoid source coverage audit

on:
  push:
    branches:
      - "feat/hoid-ia-core-run*"
    paths:
      - "src/hoid/**"
      - "docs/hoid/SOURCE_COVERAGE_AUDIT.md"
      - ".github/workflows/hoid-source-coverage-audit.yml"
  pull_request:
    paths:
      - "src/hoid/**"
      - "docs/hoid/SOURCE_COVERAGE_AUDIT.md"
      - ".github/workflows/hoid-source-coverage-audit.yml"

permissions:
  contents: read

jobs:
  source-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Audit catalogue, navigation, inspected documents and staging
        run: >-
          npx vitest run
          src/hoid/sourceCoverage.test.ts
          src/hoid/sourceCatalogManifest.test.ts
          src/hoid/verifiedChapterDocuments.test.ts
          src/hoid/bibliographyCoverage.test.ts
          src/hoid/editionStructure.test.ts
          src/hoid/readingManifest.test.ts
          src/hoid/editorialDrafts.test.ts
          src/hoid/editorialKnowledgeBundle.test.ts
          src/hoid/editorialRegistry.test.ts
          src/hoid/providerAdapter.test.ts
          src/hoid/selectionProtocol.test.ts
          src/hoid/providerTimeout.test.ts
          src/hoid/recommendations.test.ts
          src/hoid/readingAwareRecommendations.test.ts
          src/hoid/evidenceRuntime.test.ts
          src/hoid/cursorEvidenceRuntime.test.ts
      - name: Type-check source coverage boundaries
        run: >-
          npx tsc --noEmit --strict --target ES2020 --module commonjs
          --moduleResolution node --skipLibCheck
          src/hoid/sourceCoverage.ts
          src/hoid/sourceCatalogManifest.ts
          src/hoid/verifiedChapterDocuments.ts
          src/hoid/verifiedChapterLocators.ts
          src/hoid/readingManifest.ts
          src/hoid/editionStructure.ts
          src/hoid/bibliography.ts
          src/hoid/editorialDrafts.ts
          src/hoid/editorialRegistry.ts
          src/hoid/providerAdapter.ts
          src/hoid/selectionProtocol.ts
          src/hoid/providerTimeout.ts
          src/hoid/recommendations.ts
          src/hoid/readingAwareRecommendations.ts
          src/hoid/conversationGateway.ts
          src/hoid/evidenceRuntime.ts
          src/hoid/cursorEvidenceRuntime.ts
