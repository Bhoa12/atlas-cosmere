name: Hoid complete editorial review bundle

on:
  push:
    branches:
      - "feat/hoid-ia-core-run*"
    paths:
      - "src/hoid/editorialClaimReviewPackets.ts"
      - "src/hoid/editorialClaimReviewPackets.test.ts"
      - "src/hoid/editorialReviewBundle.ts"
      - "src/hoid/editorialReviewBundle.test.ts"
      - "src/hoid/editorialKnowledgeBundle.ts"
      - "src/hoid/editorialKnowledgeBundle.test.ts"
      - "src/hoid/editorialReviewPackets.ts"
      - "src/hoid/editorialReviewPackets.test.ts"
      - "src/hoid/editorialEntityDrafts.ts"
      - "src/hoid/editorialEntityDrafts.test.ts"
      - "src/hoid/editorialRelationshipDrafts.ts"
      - "src/hoid/editorialRelationshipDrafts.test.ts"
      - "src/hoid/editorialClaimDrafts.ts"
      - "src/hoid/editorialClaimDrafts.test.ts"
      - "src/hoid/editorialDrafts.ts"
      - "src/hoid/editorialDrafts.test.ts"
      - "src/hoid/verifiedChapterDocuments.ts"
      - "src/hoid/cosmereNavigationAudit.test.ts"
      - "src/hoid/readingManifest.ts"
      - "src/hoid/sha256.ts"
      - "docs/hoid/EDITORIAL_REVIEW_BUNDLE.md"
      - "docs/hoid/COMPLETE_EDITORIAL_KNOWLEDGE_BUNDLE.md"
      - "docs/hoid/ROSHAR_CHAPTER_NINE_INGESTION.md"
      - "docs/hoid/EDITORIAL_DRAFT_PIPELINE.md"
      - ".github/workflows/hoid-editorial-review-bundle.yml"
  pull_request:
    paths:
      - "src/hoid/editorialClaimReviewPackets.ts"
      - "src/hoid/editorialClaimReviewPackets.test.ts"
      - "src/hoid/editorialReviewBundle.ts"
      - "src/hoid/editorialReviewBundle.test.ts"
      - "src/hoid/editorialKnowledgeBundle.ts"
      - "src/hoid/editorialKnowledgeBundle.test.ts"
      - "src/hoid/editorialReviewPackets.ts"
      - "src/hoid/editorialReviewPackets.test.ts"
      - "src/hoid/editorialEntityDrafts.ts"
      - "src/hoid/editorialEntityDrafts.test.ts"
      - "src/hoid/editorialRelationshipDrafts.ts"
      - "src/hoid/editorialRelationshipDrafts.test.ts"
      - "src/hoid/editorialClaimDrafts.ts"
      - "src/hoid/editorialClaimDrafts.test.ts"
      - "src/hoid/editorialDrafts.ts"
      - "src/hoid/editorialDrafts.test.ts"
      - "src/hoid/verifiedChapterDocuments.ts"
      - "src/hoid/cosmereNavigationAudit.test.ts"
      - "src/hoid/readingManifest.ts"
      - "src/hoid/sha256.ts"
      - "docs/hoid/EDITORIAL_REVIEW_BUNDLE.md"
      - "docs/hoid/COMPLETE_EDITORIAL_KNOWLEDGE_BUNDLE.md"
      - "docs/hoid/ROSHAR_CHAPTER_NINE_INGESTION.md"
      - "docs/hoid/EDITORIAL_DRAFT_PIPELINE.md"
      - ".github/workflows/hoid-editorial-review-bundle.yml"

permissions:
  contents: read

jobs:
  editorial-review-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test complete editorial review orchestration
        run: npx vitest run src/hoid/editorialClaimReviewPackets.test.ts src/hoid/editorialReviewBundle.test.ts src/hoid/editorialKnowledgeBundle.test.ts src/hoid/editorialReviewPackets.test.ts src/hoid/editorialEntityDrafts.test.ts src/hoid/editorialRelationshipDrafts.test.ts src/hoid/editorialClaimDrafts.test.ts src/hoid/editorialDrafts.test.ts src/hoid/promotionReviewAuthority.test.ts src/hoid/verifiedChapterDocuments.test.ts src/hoid/cosmereNavigationAudit.test.ts src/hoid/evidenceScope.test.ts src/hoid/readingManifest.test.ts src/hoid/readingBoundary.test.ts src/hoid/editorialRegistry.test.ts
      - name: Type-check editorial review and provenance boundaries
        run: npx tsc --noEmit --strict --target ES2020 --module commonjs --moduleResolution node --skipLibCheck src/hoid/editorialReviewBundle.ts src/hoid/editorialClaimReviewPackets.ts src/hoid/editorialKnowledgeBundle.ts src/hoid/promotionReviewAuthority.ts src/hoid/editorialReviewPackets.ts src/hoid/editorialEntityDrafts.ts src/hoid/editorialRelationshipDrafts.ts src/hoid/editorialClaimDrafts.ts src/hoid/editorialDrafts.ts src/hoid/knowledgeGraph.ts src/hoid/cursorEvidenceRuntime.ts src/hoid/cursorProgressLedger.ts src/hoid/readingBoundary.ts src/hoid/progressLedger.ts src/hoid/sqliteProgressStore.ts src/hoid/sha256.ts src/hoid/evidenceScope.ts src/hoid/editionProgressValidation.ts src/hoid/readingValidation.ts src/hoid/readingManifest.ts src/hoid/editionStructure.ts src/hoid/verifiedChapterLocators.ts src/hoid/verifiedChapterDocuments.ts src/hoid/bibliography.ts src/hoid/catalog.ts src/hoid/catalogValidation.ts src/hoid/readingContext.ts src/hoid/types.ts
