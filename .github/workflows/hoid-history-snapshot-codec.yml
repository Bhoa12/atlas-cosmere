name: Hoid canonical progress-scoped history codec

on:
  push:
    branches:
      - "feat/hoid-ia-core-run306"
    paths:
      - "src/hoid/conversationHistorySnapshotCodec.ts"
      - "src/hoid/conversationHistorySnapshotCodec.test.ts"
      - "src/hoid/conversationHistoryHydration.ts"
      - "src/hoid/conversationHistoryHydration.test.ts"
      - "src/hoid/conversationHistoryPolicy.ts"
      - "src/hoid/conversationVault.ts"
      - "src/hoid/sha256.ts"
      - "docs/hoid/RUN306_CANONICAL_HISTORY_CODEC.md"
      - ".github/workflows/hoid-history-snapshot-codec.yml"
  pull_request:
    paths:
      - "src/hoid/conversationHistorySnapshotCodec.ts"
      - "src/hoid/conversationHistorySnapshotCodec.test.ts"
      - "src/hoid/conversationHistoryHydration.ts"
      - "src/hoid/conversationHistoryHydration.test.ts"
      - "src/hoid/conversationHistoryPolicy.ts"
      - "src/hoid/conversationVault.ts"
      - "src/hoid/sha256.ts"
      - "docs/hoid/RUN306_CANONICAL_HISTORY_CODEC.md"
      - ".github/workflows/hoid-history-snapshot-codec.yml"

permissions:
  contents: read

jobs:
  canonical-history-codec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test canonical codec and hydration regressions
        run: >-
          npx vitest run
          src/hoid/conversationHistorySnapshotCodec.test.ts
          src/hoid/conversationHistoryHydration.test.ts
      - name: Type-check canonical codec and dependencies
        run: >-
          npx tsc --noEmit --strict --target ES2020 --module commonjs
          --moduleResolution node --esModuleInterop --skipLibCheck
          src/hoid/conversationHistorySnapshotCodec.ts
          src/hoid/conversationHistorySnapshotCodec.test.ts
          src/hoid/conversationHistoryHydration.ts
          src/hoid/conversationHistoryPolicy.ts
          src/hoid/conversationVault.ts
          src/hoid/sha256.ts
