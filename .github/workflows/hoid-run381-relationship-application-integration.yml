name: Hoid Run 381 — relationship application integration

on:
  pull_request:
    paths:
      - "src/hoid/conversationApplicationService.ts"
      - "src/hoid/entityRelationshipApplicationAdapter.ts"
      - "src/hoid/entityRelationshipApplicationAdapter.test.ts"
      - "src/hoid/entityRelationshipConversation.ts"
      - "src/hoid/entityRelationshipConversation.test.ts"
      - "src/hoid/entityRelationshipIntent.ts"
      - "src/hoid/conversationRouteExecution.ts"
      - "src/hoid/conversationRouteExecution.test.ts"
      - "src/hoid/conversationRoutePlan.ts"
      - "src/hoid/conversationRoutePlan.test.ts"
      - "src/hoid/trustedScreenIntegration.test.ts"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/RUN381_RELATIONSHIP_APPLICATION_INTEGRATION.md"
      - ".github/workflows/hoid-run381-relationship-application-integration.yml"
  push:
    branches:
      - "feat/hoid-ia-core-run381"
    paths:
      - "src/hoid/conversationApplicationService.ts"
      - "src/hoid/entityRelationshipApplicationAdapter.ts"
      - "src/hoid/entityRelationshipApplicationAdapter.test.ts"
      - "src/hoid/entityRelationshipConversation.ts"
      - "src/hoid/entityRelationshipConversation.test.ts"
      - "src/hoid/entityRelationshipIntent.ts"
      - "src/hoid/conversationRouteExecution.ts"
      - "src/hoid/conversationRouteExecution.test.ts"
      - "src/hoid/conversationRoutePlan.ts"
      - "src/hoid/conversationRoutePlan.test.ts"
      - "src/hoid/trustedScreenIntegration.test.ts"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/RUN381_RELATIONSHIP_APPLICATION_INTEGRATION.md"
      - ".github/workflows/hoid-run381-relationship-application-integration.yml"

permissions:
  contents: read

jobs:
  relationship-application-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run relationship and application regressions
        run: >-
          npx vitest run
          src/hoid/entityRelationshipApplicationAdapter.test.ts
          src/hoid/entityRelationshipConversation.test.ts
          src/hoid/conversationApplicationService.test.ts
          src/hoid/conversationRouteExecution.test.ts
          src/hoid/conversationRoutePlan.test.ts
          src/hoid/trustedScreenIntegration.test.ts
      - name: Strict TypeScript check
        run: >-
          npx tsc --noEmit --strict
          --target ES2020
          --module commonjs
          --moduleResolution node
          --skipLibCheck
          --esModuleInterop
          --jsx react-native
          src/hoid/conversationApplicationService.ts
          src/hoid/entityRelationshipApplicationAdapter.ts
          src/hoid/entityRelationshipApplicationAdapter.test.ts
          src/hoid/entityRelationshipConversation.ts
          src/hoid/entityRelationshipConversation.test.ts
          src/hoid/entityRelationshipIntent.ts
          src/hoid/conversationRouteExecution.ts
          src/hoid/conversationRouteExecution.test.ts
          src/hoid/conversationRoutePlan.ts
          src/hoid/conversationRoutePlan.test.ts
          src/screens/HoidScreen.tsx
