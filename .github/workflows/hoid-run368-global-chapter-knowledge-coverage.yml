name: Hoid Run 368 — global chapter knowledge coverage

on:
  push:
    branches:
      - "feat/hoid-ia-core-run368"
    paths:
      - "src/hoid/chapterKnowledgeCoverage.ts"
      - "src/hoid/chapterKnowledgeCoverage.test.ts"
      - "src/hoid/chapterKnowledgeReadiness.ts"
      - "src/hoid/chapterKnowledgeReadiness.test.ts"
      - "src/hoid/bibliography.ts"
      - "src/hoid/sourceCoverage.ts"
      - "src/hoid/sourceCoverage.test.ts"
      - "src/hoid/sourceCoverageDisplayProjection.ts"
      - "src/hoid/sourceCoverageDisplayProjection.test.ts"
      - "src/components/HoidSourceCoveragePanel.tsx"
      - "docs/hoid/RUN368_GLOBAL_CHAPTER_KNOWLEDGE_COVERAGE.md"
      - ".github/workflows/hoid-run368-global-chapter-knowledge-coverage.yml"
  pull_request:
    paths:
      - "src/hoid/chapterKnowledgeCoverage.ts"
      - "src/hoid/chapterKnowledgeCoverage.test.ts"
      - "src/hoid/chapterKnowledgeReadiness.ts"
      - "src/hoid/chapterKnowledgeReadiness.test.ts"
      - "src/hoid/bibliography.ts"
      - "src/hoid/sourceCoverage.ts"
      - "src/hoid/sourceCoverage.test.ts"
      - "src/hoid/sourceCoverageDisplayProjection.ts"
      - "src/hoid/sourceCoverageDisplayProjection.test.ts"
      - "src/components/HoidSourceCoveragePanel.tsx"
      - "docs/hoid/RUN368_GLOBAL_CHAPTER_KNOWLEDGE_COVERAGE.md"
      - ".github/workflows/hoid-run368-global-chapter-knowledge-coverage.yml"

permissions:
  contents: read

jobs:
  global-chapter-knowledge-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run chapter readiness and global coverage regressions
        run: >-
          npx vitest run
          src/hoid/chapterKnowledgeReadiness.test.ts
          src/hoid/chapterKnowledgeCoverage.test.ts
          src/hoid/sourceCoverage.test.ts
          src/hoid/sourceCoverageDisplayProjection.test.ts
      - name: Strict TypeScript check
        run: >-
          npx tsc --noEmit --strict
          --target ES2020
          --module commonjs
          --moduleResolution node
          --skipLibCheck
          --esModuleInterop
          --jsx react-native
          src/hoid/chapterKnowledgeCoverage.ts
          src/hoid/chapterKnowledgeCoverage.test.ts
          src/hoid/chapterKnowledgeReadiness.ts
          src/hoid/chapterKnowledgeReadiness.test.ts
          src/components/HoidSourceCoveragePanel.tsx
