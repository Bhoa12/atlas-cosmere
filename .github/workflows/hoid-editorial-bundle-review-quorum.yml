name: Hoid editorial bundle review quorum

on:
  push:
    branches:
      - "feat/hoid-ia-core-run*"
    paths:
      - "src/hoid/editorialReviewBundleQuorum.ts"
      - "src/hoid/editorialReviewBundleQuorum.test.ts"
      - "src/hoid/editorialKnowledgeBundle.ts"
      - "src/hoid/editorialKnowledgeBundle.test.ts"
      - "src/hoid/editorialReviewSignatures.ts"
      - "src/hoid/editorialReviewSignatures.test.ts"
      - "docs/hoid/RUN317_EDITORIAL_REVIEW_BUNDLE_QUORUM.md"
      - ".github/workflows/hoid-editorial-bundle-review-quorum.yml"
  pull_request:
    paths:
      - "src/hoid/editorialReviewBundleQuorum.ts"
      - "src/hoid/editorialReviewBundleQuorum.test.ts"
      - "src/hoid/editorialKnowledgeBundle.ts"
      - "src/hoid/editorialKnowledgeBundle.test.ts"
      - "src/hoid/editorialReviewSignatures.ts"
      - "src/hoid/editorialReviewSignatures.test.ts"
      - "docs/hoid/RUN317_EDITORIAL_REVIEW_BUNDLE_QUORUM.md"
      - ".github/workflows/hoid-editorial-bundle-review-quorum.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial-bundle-review-quorum:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test bundle-bound editorial review quorum
        run: >-
          npx vitest run
          src/hoid/editorialReviewBundleQuorum.test.ts
          src/hoid/editorialReviewSignatures.test.ts
          src/hoid/editorialKnowledgeBundle.test.ts
      - name: Strict type-check review boundary
        run: >-
          npx tsc --noEmit --strict --target ES2020
          --module commonjs --moduleResolution node
          --esModuleInterop --skipLibCheck --lib ES2020,DOM
          src/hoid/editorialReviewBundleQuorum.ts
