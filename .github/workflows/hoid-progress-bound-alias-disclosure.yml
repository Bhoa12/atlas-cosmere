name: Hoid progress-bound alias disclosure

on:
  push:
    branches:
      - "feat/hoid-ia-core-run*"
    paths:
      - "src/hoid/aliasDisclosureBoundary.ts"
      - "src/hoid/aliasDisclosureBoundary.test.ts"
      - "src/hoid/productionAliasDisclosurePort.ts"
      - "src/hoid/productionAliasDisclosurePort.test.ts"
      - "docs/hoid/RUN213_PRODUCTION_ALIAS_RESOLVER_NON_INJECTABILITY.md"
      - "src/hoid/contextPolicy.ts"
      - "src/hoid/HoidService.ts"
      - "src/hoid/HoidServiceCatalogBoundary.test.ts"
      - "src/hoid/pipeline.ts"
      - "src/hoid/legacyAliasDisclosure.test.ts"
      - "src/hoid/service.ts"
      - ".github/workflows/hoid-progress-bound-alias-disclosure.yml"
  pull_request:
    paths:
      - "src/hoid/aliasDisclosureBoundary.ts"
      - "src/hoid/aliasDisclosureBoundary.test.ts"
      - "src/hoid/productionAliasDisclosurePort.ts"
      - "src/hoid/productionAliasDisclosurePort.test.ts"
      - "docs/hoid/RUN213_PRODUCTION_ALIAS_RESOLVER_NON_INJECTABILITY.md"
      - "src/hoid/contextPolicy.ts"
      - "src/hoid/HoidService.ts"
      - "src/hoid/HoidServiceCatalogBoundary.test.ts"
      - "src/hoid/pipeline.ts"
      - "src/hoid/legacyAliasDisclosure.test.ts"
      - "src/hoid/service.ts"
      - ".github/workflows/hoid-progress-bound-alias-disclosure.yml"

permissions:
  contents: read

jobs:
  progress-bound-alias-disclosure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test progress-bound alias authorization and production resolver lock
        run: >-
          npx vitest run
          src/hoid/aliasDisclosureBoundary.test.ts
          src/hoid/productionAliasDisclosurePort.test.ts
          src/hoid/legacyAliasDisclosure.test.ts
          src/hoid/HoidServiceCatalogBoundary.test.ts
      - name: Type-check alias and SQLite progress boundaries
        run: >-
          npx tsc --noEmit --strict --target ES2020 --module commonjs
          --moduleResolution node --skipLibCheck
          src/hoid/aliasDisclosureBoundary.ts
          src/hoid/productionAliasDisclosurePort.ts
          src/hoid/contextPolicy.ts
          src/hoid/HoidService.ts
          src/hoid/pipeline.ts
          src/hoid/service.ts
          src/hoid/aliasDisclosureBoundary.test.ts
          src/hoid/productionAliasDisclosurePort.test.ts
          src/hoid/legacyAliasDisclosure.test.ts
          src/hoid/HoidServiceCatalogBoundary.test.ts
