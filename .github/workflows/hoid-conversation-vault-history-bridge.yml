name: Hoid encrypted conversation history bridge

on:
  push:
    branches:
      - "feat/hoid-ia-core-run299"
    paths:
      - "src/hoid/conversationVaultHistoryCodec.ts"
      - "src/hoid/conversationVaultHistoryBridge.ts"
      - "src/hoid/conversationVaultHistoryBridge.test.ts"
      - "src/hoid/conversationHistoryHydration.ts"
      - "src/hoid/conversationHistoryPolicy.ts"
      - "src/hoid/conversationVault.ts"
      - "docs/hoid/RUN299_CONVERSATION_VAULT_HISTORY_BRIDGE.md"
      - ".github/workflows/hoid-conversation-vault-history-bridge.yml"
  pull_request:
    paths:
      - "src/hoid/conversationVaultHistoryCodec.ts"
      - "src/hoid/conversationVaultHistoryBridge.ts"
      - "src/hoid/conversationVaultHistoryBridge.test.ts"
      - "src/hoid/conversationHistoryHydration.ts"
      - "src/hoid/conversationHistoryPolicy.ts"
      - "src/hoid/conversationVault.ts"
      - "docs/hoid/RUN299_CONVERSATION_VAULT_HISTORY_BRIDGE.md"
      - ".github/workflows/hoid-conversation-vault-history-bridge.yml"

permissions:
  contents: read

jobs:
  conversation-vault-history-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test vault, history hydration and bridge
        run: npx vitest run src/hoid/conversationVaultHistoryBridge.test.ts src/hoid/conversationHistoryHydration.test.ts src/hoid/conversationVault.test.ts
      - name: Type-check bridge and codec
        run: npx tsc --noEmit --strict --target ES2020 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck src/hoid/conversationVaultHistoryCodec.ts src/hoid/conversationVaultHistoryBridge.ts src/hoid/conversationVaultHistoryBridge.test.ts
