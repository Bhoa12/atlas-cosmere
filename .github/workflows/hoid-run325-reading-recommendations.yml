name: Hoid Run 325 progress-aware reading recommendation planner

on:
  pull_request:
    paths:
      - "src/hoid/readingRecommendationPlanner.ts"
      - "src/hoid/readingRecommendationPlanner.test.ts"
      - "src/hoid/unitProgressCursor.ts"
      - "src/hoid/unitProgressLedger.ts"
      - "src/hoid/readingManifest.ts"
      - "src/hoid/editionStructure.ts"
      - "src/hoid/bibliography.ts"
      - "docs/hoid/RUN325_PROGRESS_AWARE_RECOMMENDATIONS.md"
      - ".github/workflows/hoid-run325-reading-recommendations.yml"
  push:
    branches:
      - "feat/hoid-ia-core-run325"
    paths:
      - "src/hoid/readingRecommendationPlanner.ts"
      - "src/hoid/readingRecommendationPlanner.test.ts"
      - "src/hoid/unitProgressCursor.ts"
      - "src/hoid/unitProgressLedger.ts"
      - "src/hoid/readingManifest.ts"
      - "src/hoid/editionStructure.ts"
      - "src/hoid/bibliography.ts"
      - "docs/hoid/RUN325_PROGRESS_AWARE_RECOMMENDATIONS.md"
      - ".github/workflows/hoid-run325-reading-recommendations.yml"

permissions:
  contents: read

jobs:
  reading-recommendation-planner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test progress-aware recommendations and spoiler regressions
        run: >-
          npx vitest run
          src/hoid/readingRecommendationPlanner.test.ts
          src/hoid/exactUnitSpoilerDependencyGate.test.ts
          src/hoid/exactUnitEvidenceRuntime.test.ts
      - name: Strict type-check recommendation planner
        run: >-
          npx tsc --noEmit --strict
          --target ES2022
          --module commonjs
          --moduleResolution node
          --lib ES2022,DOM
          --skipLibCheck
          src/hoid/readingRecommendationPlanner.ts
          src/hoid/readingRecommendationPlanner.test.ts
