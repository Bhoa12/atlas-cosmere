name: Hoid offline EPUB ingestion

on:
  push:
    branches:
      - "feat/hoid-ia-core-run*"
    paths:
      - "src/hoid/epubIngestion.ts"
      - "src/hoid/epubIngestion.test.ts"
      - "src/hoid/sourceIngestionExecution.ts"
      - "src/hoid/sourceIngestionExecution.test.ts"
      - "src/hoid/sourceIngestionPlan.ts"
      - "src/hoid/epubImportSelection.ts"
      - "src/components/HoidEpubImportPanel.tsx"
      - "docs/hoid/SOURCE_INGESTION_PLAN.md"
      - "src/hoid/bibliography.ts"
      - "src/hoid/editionStructure.ts"
      - "src/hoid/sourceCoverage.ts"
      - "src/hoid/verifiedChapterDocuments.ts"
      - "docs/hoid/OFFLINE_EPUB_INGESTION.md"
      - ".github/workflows/hoid-offline-epub-ingestion.yml"
  pull_request:
    paths:
      - "src/hoid/epubIngestion.ts"
      - "src/hoid/epubIngestion.test.ts"
      - "src/hoid/sourceIngestionExecution.ts"
      - "src/hoid/sourceIngestionExecution.test.ts"
      - "src/hoid/sourceIngestionPlan.ts"
      - "src/hoid/epubImportSelection.ts"
      - "src/components/HoidEpubImportPanel.tsx"
      - "docs/hoid/SOURCE_INGESTION_PLAN.md"
      - "src/hoid/bibliography.ts"
      - "src/hoid/editionStructure.ts"
      - "src/hoid/sourceCoverage.ts"
      - "src/hoid/verifiedChapterDocuments.ts"
      - "docs/hoid/OFFLINE_EPUB_INGESTION.md"
      - ".github/workflows/hoid-offline-epub-ingestion.yml"

permissions:
  contents: read

jobs:
  offline-epub-ingestion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test offline package and chapter inspection
        run: >-
          npx vitest run
          src/hoid/epubIngestion.test.ts
          src/hoid/sourceIngestionExecution.test.ts
          src/hoid/sourceCoverage.test.ts
          src/hoid/verifiedChapterDocuments.test.ts
          src/hoid/editionStructure.test.ts
          src/hoid/readingManifest.test.ts
      - name: Type-check ingestion and coverage contracts
        run: >-
          npx tsc --noEmit --strict --target ES2020 --module commonjs
          --moduleResolution node --skipLibCheck
          src/hoid/epubIngestion.ts
          src/hoid/sourceIngestionExecution.ts
          src/hoid/sourceIngestionExecution.test.ts
          src/hoid/epubIngestion.test.ts
          src/hoid/sourceCoverage.ts
          src/hoid/verifiedChapterDocuments.ts
          src/hoid/verifiedChapterLocators.ts
          src/hoid/readingManifest.ts
          src/hoid/editionStructure.ts
          src/hoid/bibliography.ts
          src/hoid/editorialDrafts.ts
          src/hoid/editorialRegistry.ts
