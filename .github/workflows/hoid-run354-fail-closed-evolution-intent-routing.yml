name: Hoid Run 354 — fail-closed evolution intent routing

on:
  push:
    branches:
      - "feat/hoid-ia-core-run354"
    paths:
      - "src/hoid/entityEvolutionExplanationIntent.ts"
      - "src/hoid/entityEvolutionExplanationIntent.test.ts"
      - "src/hoid/entityEvolutionExplanation.ts"
      - "src/hoid/entityEvolutionExplanation.test.ts"
      - "src/hoid/magicSystemExplanation.ts"
      - "src/hoid/magicSystemExplanation.test.ts"
      - "src/hoid/entityDossierConversation.test.ts"
      - "src/hoid/entityRelationshipConversation.test.ts"
      - "src/hoid/entityProgressTimeline.test.ts"
      - "src/hoid/evidenceRuntime.test.ts"
      - "src/hoid/answerDisplayProjection.test.ts"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/RUN354_FAIL_CLOSED_EVOLUTION_INTENT_ROUTING.md"
      - ".github/workflows/hoid-run354-fail-closed-evolution-intent-routing.yml"
  pull_request:
    paths:
      - "src/hoid/entityEvolutionExplanationIntent.ts"
      - "src/hoid/entityEvolutionExplanationIntent.test.ts"
      - "src/hoid/entityEvolutionExplanation.ts"
      - "src/hoid/entityEvolutionExplanation.test.ts"
      - "src/hoid/magicSystemExplanation.ts"
      - "src/hoid/magicSystemExplanation.test.ts"
      - "src/hoid/entityDossierConversation.test.ts"
      - "src/hoid/entityRelationshipConversation.test.ts"
      - "src/hoid/entityProgressTimeline.test.ts"
      - "src/hoid/evidenceRuntime.test.ts"
      - "src/hoid/answerDisplayProjection.test.ts"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/RUN354_FAIL_CLOSED_EVOLUTION_INTENT_ROUTING.md"
      - ".github/workflows/hoid-run354-fail-closed-evolution-intent-routing.yml"

permissions:
  contents: read

jobs:
  evolution-intent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run parser and inherited Hoid regressions
        run: >-
          npx vitest run
          src/hoid/entityEvolutionExplanationIntent.test.ts
          src/hoid/entityEvolutionExplanation.test.ts
          src/hoid/magicSystemExplanation.test.ts
          src/hoid/entityDossierConversation.test.ts
          src/hoid/entityRelationshipConversation.test.ts
          src/hoid/entityProgressTimeline.test.ts
          src/hoid/evidenceRuntime.test.ts
          src/hoid/answerDisplayProjection.test.ts
      - name: Strict TypeScript check
        run: >-
          npx tsc --noEmit --strict
          --target ES2020
          --module commonjs
          --moduleResolution node
          --skipLibCheck
          --esModuleInterop
          --jsx react-native
          src/hoid/entityEvolutionExplanationIntent.ts
          src/hoid/entityEvolutionExplanationIntent.test.ts
          src/hoid/entityEvolutionExplanation.ts
          src/hoid/entityEvolutionExplanation.test.ts
          src/hoid/magicSystemExplanation.ts
          src/hoid/magicSystemExplanation.test.ts
          src/hoid/conversationIntent.ts
          src/screens/HoidScreen.tsx
