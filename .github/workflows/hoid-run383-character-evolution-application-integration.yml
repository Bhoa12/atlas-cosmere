name: Hoid Run 383 — character evolution application integration

on:
  pull_request:
    paths:
      - "src/hoid/conversationApplicationService.ts"
      - "src/hoid/entityEvolutionExplanation.ts"
      - "src/hoid/entityEvolutionExplanation.test.ts"
      - "src/hoid/entityEvolutionExplanationIntent.ts"
      - "src/hoid/entityEvolutionExplanationApplicationAdapter.ts"
      - "src/hoid/entityEvolutionExplanationApplicationAdapter.test.ts"
      - "src/hoid/conversationRouteExecution.ts"
      - "src/hoid/conversationRouteExecution.test.ts"
      - "src/hoid/conversationRoutePlan.ts"
      - "src/hoid/conversationRoutePlan.test.ts"
      - "src/hoid/trustedScreenIntegration.test.ts"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/RUN383_CHARACTER_EVOLUTION_APPLICATION_INTEGRATION.md"
      - ".github/workflows/hoid-run383-character-evolution-application-integration.yml"
  push:
    branches:
      - "feat/hoid-ia-core-run383"
    paths:
      - "src/hoid/conversationApplicationService.ts"
      - "src/hoid/entityEvolutionExplanation.ts"
      - "src/hoid/entityEvolutionExplanation.test.ts"
      - "src/hoid/entityEvolutionExplanationIntent.ts"
      - "src/hoid/entityEvolutionExplanationApplicationAdapter.ts"
      - "src/hoid/entityEvolutionExplanationApplicationAdapter.test.ts"
      - "src/hoid/conversationRouteExecution.ts"
      - "src/hoid/conversationRouteExecution.test.ts"
      - "src/hoid/conversationRoutePlan.ts"
      - "src/hoid/conversationRoutePlan.test.ts"
      - "src/hoid/trustedScreenIntegration.test.ts"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/RUN383_CHARACTER_EVOLUTION_APPLICATION_INTEGRATION.md"
      - ".github/workflows/hoid-run383-character-evolution-application-integration.yml"

permissions:
  contents: read

jobs:
  character-evolution-application-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run evolution and application regressions
        run: >-
          npx vitest run
          src/hoid/entityEvolutionExplanationApplicationAdapter.test.ts
          src/hoid/entityEvolutionExplanation.test.ts
          src/hoid/conversationApplicationService.test.ts
          src/hoid/conversationRouteExecution.test.ts
          src/hoid/conversationRoutePlan.test.ts
          src/hoid/trustedScreenIntegration.test.ts
      - name: Strict TypeScript check
        run: >-
          npx tsc --noEmit --strict
          --target ES2020
          --module commonjs
          --moduleResolution node
          --skipLibCheck
          --esModuleInterop
          --jsx react-native
          src/hoid/conversationApplicationService.ts
          src/hoid/entityEvolutionExplanation.ts
          src/hoid/entityEvolutionExplanationIntent.ts
          src/hoid/entityEvolutionExplanationApplicationAdapter.ts
          src/hoid/entityEvolutionExplanationApplicationAdapter.test.ts
          src/hoid/conversationRouteExecution.ts
          src/hoid/conversationRoutePlan.ts
          src/hoid/trustedScreenIntegration.test.ts
          src/screens/HoidScreen.tsx
