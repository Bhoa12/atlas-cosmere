name: Hoid native Ed25519 and trusted host

on:
  push:
    branches:
      - "feat/hoid-ia-core-run*"
    paths:
      - "package.json"
      - "src/hoid/nobleEd25519VerificationAdapter.ts"
      - "src/hoid/nobleEd25519VerificationAdapter.test.ts"
      - "src/hoid/trustedHostBootstrap.ts"
      - "src/hoid/trustedHostBootstrap.test.ts"
      - "src/hoid/trustedHostPromotionAuthority.ts"
      - "src/hoid/trustedHostPromotionAuthority.test.ts"
      - "src/hoid/editorialReviewSignatures.ts"
      - "src/hoid/editorialReviewSignatures.test.ts"
      - "src/hoid/trustRegistryRevisionStore.ts"
      - "src/hoid/trustRegistryRevisionStore.test.ts"
      - "src/hoid/signedEditorialBundlePromotionAuthority.ts"
      - "src/hoid/signedEditorialBundlePromotionAuthority.test.ts"
      - "docs/hoid/NATIVE_TRUSTED_HOST_INTEGRATION.md"
      - ".github/workflows/hoid-native-ed25519-trusted-host.yml"
  pull_request:
    paths:
      - "package.json"
      - "src/hoid/nobleEd25519VerificationAdapter.ts"
      - "src/hoid/nobleEd25519VerificationAdapter.test.ts"
      - "src/hoid/trustedHostBootstrap.ts"
      - "src/hoid/trustedHostBootstrap.test.ts"
      - "src/hoid/editorialReviewSignatures.ts"
      - "src/hoid/editorialReviewSignatures.test.ts"
      - "src/hoid/trustRegistryRevisionStore.ts"
      - "src/hoid/trustRegistryRevisionStore.test.ts"
      - "src/hoid/signedEditorialBundlePromotionAuthority.ts"
      - "src/hoid/signedEditorialBundlePromotionAuthority.test.ts"
      - "docs/hoid/NATIVE_TRUSTED_HOST_INTEGRATION.md"
      - ".github/workflows/hoid-native-ed25519-trusted-host.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-ed25519-trusted-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 20.19 for Noble Curves v2
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify pinned cryptography dependency
        run: npm ls @noble/curves --all
      - name: Run cryptographic, bootstrap and two-reviewer dry-run tests
        run: >-
          npx vitest run
          src/hoid/nobleEd25519VerificationAdapter.test.ts
          src/hoid/trustedHostBootstrap.test.ts
          src/hoid/trustedHostPromotionAuthority.test.ts
          src/hoid/editorialReviewSignatures.test.ts
          src/hoid/trustRegistryRevisionStore.test.ts
          src/hoid/signedEditorialBundlePromotionAuthority.test.ts
      - name: Type-check trusted host and promotion boundaries
        run: >-
          npx tsc --noEmit --strict --target ES2020
          --module ESNext --moduleResolution bundler --skipLibCheck
          src/hoid/nobleEd25519VerificationAdapter.ts
          src/hoid/trustedHostBootstrap.ts
          src/hoid/trustedHostPromotionAuthority.ts
          src/hoid/editorialReviewSignatures.ts
          src/hoid/trustRegistryRevisionStore.ts
          src/hoid/signedEditorialBundlePromotionAuthority.ts
