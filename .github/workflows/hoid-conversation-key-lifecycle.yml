name: Hoid conversation key lifecycle and managed AEAD

on:
  push:
    branches:
      - "feat/hoid-ia-core-run*"
    paths:
      - "src/hoid/conversationKeyManagement.ts"
      - "src/hoid/conversationKeyManagement.test.ts"
      - "src/hoid/managedConversationPayloadProtector.ts"
      - "src/hoid/managedConversationPayloadProtector.test.ts"
      - "src/hoid/localPrincipalIdentity.ts"
      - "src/hoid/expoSqliteConversationHistoryStore.ts"
      - "docs/hoid/RUN221_CONVERSATION_KEY_LIFECYCLE_AND_MANAGED_AEAD.md"
      - "docs/hoid/RUN222_KEY_ROTATION_AND_CANONICAL_ENVELOPE_HARDENING.md"
      - ".github/workflows/hoid-conversation-key-lifecycle.yml"
  pull_request:
    paths:
      - "src/hoid/conversationKeyManagement.ts"
      - "src/hoid/conversationKeyManagement.test.ts"
      - "src/hoid/managedConversationPayloadProtector.ts"
      - "src/hoid/managedConversationPayloadProtector.test.ts"
      - "src/hoid/localPrincipalIdentity.ts"
      - "src/hoid/expoSqliteConversationHistoryStore.ts"
      - "docs/hoid/RUN221_CONVERSATION_KEY_LIFECYCLE_AND_MANAGED_AEAD.md"
      - "docs/hoid/RUN222_KEY_ROTATION_AND_CANONICAL_ENVELOPE_HARDENING.md"
      - ".github/workflows/hoid-conversation-key-lifecycle.yml"

permissions:
  contents: read

jobs:
  conversation-key-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test key lifecycle and managed AEAD boundaries
        run: >-
          npx vitest run
          src/hoid/conversationKeyManagement.test.ts
          src/hoid/managedConversationPayloadProtector.test.ts
      - name: Type-check key lifecycle and managed AEAD boundaries
        run: >-
          npx tsc --noEmit --strict --target ES2020 --module commonjs
          --moduleResolution node --skipLibCheck
          src/hoid/localPrincipalIdentity.ts
          src/hoid/conversationKeyManagement.ts
          src/hoid/conversationKeyManagement.test.ts
          src/hoid/conversationHistoryPolicy.ts
          src/hoid/conversationHistoryHydration.ts
          src/hoid/conversationHistoryStorePort.ts
          src/hoid/sqliteProgressStore.ts
          src/hoid/expoSqliteConversationHistoryStore.ts
          src/hoid/managedConversationPayloadProtector.ts
          src/hoid/managedConversationPayloadProtector.test.ts
