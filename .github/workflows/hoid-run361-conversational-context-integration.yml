name: Hoid Run 361 — conversational context integration

on:
  push:
    branches:
      - "feat/hoid-ia-core-run361"
    paths:
      - "src/hoid/investigationContextConversation.ts"
      - "src/hoid/investigationContextConversation.test.ts"
      - "src/hoid/investigationContextPresentation.ts"
      - "src/hoid/investigationContextPresentation.test.ts"
      - "src/hoid/investigationContext.ts"
      - "src/hoid/investigationContext.test.ts"
      - "src/hoid/knowledgeGraph.ts"
      - "src/hoid/knowledgeGraph.test.ts"
      - "src/hoid/investigationSession.ts"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/RUN361_CONVERSATIONAL_CONTEXT_INTEGRATION.md"
      - ".github/workflows/hoid-run361-conversational-context-integration.yml"
  pull_request:
    paths:
      - "src/hoid/investigationContextConversation.ts"
      - "src/hoid/investigationContextConversation.test.ts"
      - "src/hoid/investigationContextPresentation.ts"
      - "src/hoid/investigationContextPresentation.test.ts"
      - "src/hoid/investigationContext.ts"
      - "src/hoid/investigationContext.test.ts"
      - "src/hoid/knowledgeGraph.ts"
      - "src/hoid/knowledgeGraph.test.ts"
      - "src/hoid/investigationSession.ts"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/RUN361_CONVERSATIONAL_CONTEXT_INTEGRATION.md"
      - ".github/workflows/hoid-run361-conversational-context-integration.yml"

permissions:
  contents: read

jobs:
  conversational-context-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run conversational context and spoiler regressions
        run: >-
          npx vitest run
          src/hoid/investigationContextConversation.test.ts
          src/hoid/investigationContextPresentation.test.ts
          src/hoid/investigationContext.test.ts
          src/hoid/knowledgeGraph.test.ts
          src/hoid/investigationSession.test.ts
          src/hoid/entityResolver.test.ts
          src/hoid/entityDossierConversation.test.ts
          src/hoid/entityRelationshipConversation.test.ts
          src/hoid/entityProgressTimeline.test.ts
      - name: Strict TypeScript check
        run: >-
          npx tsc --noEmit --strict
          --target ES2020
          --module commonjs
          --moduleResolution node
          --skipLibCheck
          --esModuleInterop
          --jsx react-native
          src/hoid/investigationContextConversation.ts
          src/hoid/investigationContextConversation.test.ts
          src/hoid/investigationContextPresentation.ts
          src/hoid/investigationContext.ts
          src/hoid/knowledgeGraph.ts
          src/hoid/investigationSession.ts
          src/screens/HoidScreen.tsx
