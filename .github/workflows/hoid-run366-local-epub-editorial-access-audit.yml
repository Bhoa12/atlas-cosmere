name: Hoid Run 366 — local EPUB editorial access audit

on:
  push:
    branches:
      - "feat/hoid-ia-core-run366"
    paths:
      - "src/hoid/epubEditorialSourceCoverageAudit.ts"
      - "src/hoid/epubEditorialSourceCoverageAudit.test.ts"
      - "src/hoid/epubEditorialSourceAccess.ts"
      - "src/hoid/epubEditorialSourceAccess.test.ts"
      - "src/components/HoidEpubEditorialSourceAccessPanel.tsx"
      - "src/components/HoidEpubImportPanel.tsx"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/RUN366_LOCAL_EPUB_EDITORIAL_ACCESS_AUDIT.md"
      - ".github/workflows/hoid-run366-local-epub-editorial-access-audit.yml"
  pull_request:
    paths:
      - "src/hoid/epubEditorialSourceCoverageAudit.ts"
      - "src/hoid/epubEditorialSourceCoverageAudit.test.ts"
      - "src/hoid/epubEditorialSourceAccess.ts"
      - "src/hoid/epubEditorialSourceAccess.test.ts"
      - "src/components/HoidEpubEditorialSourceAccessPanel.tsx"
      - "src/components/HoidEpubImportPanel.tsx"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/RUN366_LOCAL_EPUB_EDITORIAL_ACCESS_AUDIT.md"
      - ".github/workflows/hoid-run366-local-epub-editorial-access-audit.yml"

permissions:
  contents: read

jobs:
  local-epub-editorial-access-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run source access and coverage audit regressions
        run: >-
          npx vitest run
          src/hoid/epubEditorialSourceCoverageAudit.test.ts
          src/hoid/epubEditorialSourceAccess.test.ts
          src/hoid/sourceIngestionExecution.test.ts
      - name: Strict TypeScript check
        run: >-
          npx tsc --noEmit --strict
          --target ES2020
          --module commonjs
          --moduleResolution node
          --skipLibCheck
          --esModuleInterop
          --jsx react-native
          src/hoid/epubEditorialSourceCoverageAudit.ts
          src/hoid/epubEditorialSourceCoverageAudit.test.ts
          src/hoid/epubEditorialSourceAccess.ts
          src/hoid/epubEditorialSourceAccess.test.ts
          src/components/HoidEpubEditorialSourceAccessPanel.tsx
          src/components/HoidEpubImportPanel.tsx
          src/screens/HoidScreen.tsx
