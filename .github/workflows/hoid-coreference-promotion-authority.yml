name: Hoid coreference registry promotion authority

on:
  push:
    branches:
      - "feat/hoid-ia-core-run*"
    paths:
      - "src/hoid/coreferenceRegistry.ts"
      - "src/hoid/coreferenceResolver.ts"
      - "src/hoid/coreferenceResolver.test.ts"
      - "src/hoid/coreferencePromotionAuthority.ts"
      - "src/hoid/coreferencePromotionAuthority.test.ts"
      - "src/hoid/conversationContext.ts"
      - "src/hoid/conversationContext.test.ts"
      - "src/hoid/promotionReviewAuthority.ts"
      - "src/hoid/verifiedChapterDocuments.ts"
      - "src/hoid/verifiedChapterLocators.ts"
      - "src/hoid/readingManifest.ts"
      - "src/hoid/evidenceScope.ts"
      - "src/hoid/cursorEvidenceRuntime.ts"
      - "src/hoid/knowledgeGraph.ts"
      - "src/hoid/sha256.ts"
      - "src/hoid/entityResolver.ts"
      - "src/hoid/relationshipGateway.ts"
      - "src/hoid/conversationGateway.ts"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/COREFERENCE_REGISTRY_PROMOTION_AUTHORITY.md"
      - ".github/workflows/hoid-coreference-promotion-authority.yml"
  pull_request:
    paths:
      - "src/hoid/coreferenceRegistry.ts"
      - "src/hoid/coreferenceResolver.ts"
      - "src/hoid/coreferenceResolver.test.ts"
      - "src/hoid/coreferencePromotionAuthority.ts"
      - "src/hoid/coreferencePromotionAuthority.test.ts"
      - "src/hoid/conversationContext.ts"
      - "src/hoid/conversationContext.test.ts"
      - "src/hoid/promotionReviewAuthority.ts"
      - "src/hoid/verifiedChapterDocuments.ts"
      - "src/hoid/verifiedChapterLocators.ts"
      - "src/hoid/readingManifest.ts"
      - "src/hoid/evidenceScope.ts"
      - "src/hoid/cursorEvidenceRuntime.ts"
      - "src/hoid/knowledgeGraph.ts"
      - "src/hoid/sha256.ts"
      - "src/hoid/entityResolver.ts"
      - "src/hoid/relationshipGateway.ts"
      - "src/hoid/conversationGateway.ts"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/COREFERENCE_REGISTRY_PROMOTION_AUTHORITY.md"
      - ".github/workflows/hoid-coreference-promotion-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coreference-promotion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test coreference promotion and spoiler regressions
        run: >-
          npx vitest run
          src/hoid/coreferencePromotionAuthority.test.ts
          src/hoid/coreferenceResolver.test.ts
          src/hoid/conversationContext.test.ts
          src/hoid/entityResolver.test.ts
          src/hoid/relationshipGateway.test.ts
          src/hoid/conversationGateway.test.ts
          src/hoid/conversationHistoryPolicy.test.ts
      - name: Type-check coreference promotion and application boundaries
        run: >-
          npx tsc --noEmit --strict --target ES2020 --module commonjs
          --moduleResolution node --skipLibCheck --jsx react --esModuleInterop
          src/hoid/coreferencePromotionAuthority.ts
          src/hoid/coreferenceResolver.ts
          src/hoid/conversationContext.ts
          src/hoid/promotionReviewAuthority.ts
          src/hoid/entityResolver.ts
          src/hoid/relationshipGateway.ts
          src/hoid/conversationGateway.ts
          src/screens/HoidScreen.tsx
