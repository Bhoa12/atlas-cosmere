name: Hoid spoiler-safe conversation continuity

on:
  push:
    branches:
      - "feat/hoid-ia-core-run*"
    paths:
      - "src/hoid/coreferenceRegistry.ts"
      - "src/hoid/coreferenceResolver.ts"
      - "src/hoid/coreferenceResolver.test.ts"
      - "src/hoid/conversationContext.ts"
      - "src/hoid/conversationContext.test.ts"
      - "src/hoid/entityResolver.ts"
      - "src/hoid/entityResolver.test.ts"
      - "src/hoid/relationshipGateway.ts"
      - "src/hoid/relationshipGateway.test.ts"
      - "src/hoid/conversationGateway.ts"
      - "src/hoid/conversationGateway.test.ts"
      - "src/hoid/conversationHistoryPolicy.ts"
      - "src/hoid/conversationHistoryPolicy.test.ts"
      - "src/hoid/conversationHistoryHydration.ts"
      - "src/hoid/conversationHistoryHydration.test.ts"
      - "src/hoid/conversationHistoryStorePort.ts"
      - "src/hoid/conversationHistoryStorePort.test.ts"
      - "src/hoid/expoSqliteConversationHistoryStore.ts"
      - "src/hoid/expoSqliteConversationHistoryStore.test.ts"
      - "src/hoid/sharedSqliteDatabase.ts"
      - "src/hoid/sharedSqliteDatabase.test.ts"
      - "src/hoid/expoHoidDatabase.ts"
      - "src/hoid/expoCursorProgressCoordinator.ts"
      - "src/screens/HoidScreen.tsx"
      - "src/hoid/README.md"
      - "docs/hoid/SPOILER_SAFE_CONVERSATION_CONTINUITY.md"
      - "docs/hoid/RUN214_EXPLICIT_STATIC_GREETING_AND_FAIL_CLOSED_HISTORY.md"
      - "docs/hoid/RUN215_CANONICAL_STATIC_GREETING_INTEGRITY.md"
      - "docs/hoid/RUN216_VERSIONED_CONVERSATION_HISTORY_HYDRATION.md"
      - "docs/hoid/RUN217_PROVIDER_NEUTRAL_CONVERSATION_STORAGE_PORT.md"
      - "docs/hoid/RUN218_EXPO_SQLITE_CONVERSATION_HISTORY_ADAPTER.md"
      - "docs/hoid/RUN219_SHARED_EXPO_SQLITE_DATABASE_LIFECYCLE.md"
      - ".github/workflows/hoid-spoiler-safe-conversation-continuity.yml"
  pull_request:
    paths:
      - "src/hoid/coreferenceRegistry.ts"
      - "src/hoid/coreferenceResolver.ts"
      - "src/hoid/coreferenceResolver.test.ts"
      - "src/hoid/conversationContext.ts"
      - "src/hoid/conversationContext.test.ts"
      - "src/hoid/entityResolver.ts"
      - "src/hoid/entityResolver.test.ts"
      - "src/hoid/relationshipGateway.ts"
      - "src/hoid/relationshipGateway.test.ts"
      - "src/hoid/conversationGateway.ts"
      - "src/hoid/conversationGateway.test.ts"
      - "src/hoid/conversationHistoryPolicy.ts"
      - "src/hoid/conversationHistoryPolicy.test.ts"
      - "src/hoid/conversationHistoryHydration.ts"
      - "src/hoid/conversationHistoryHydration.test.ts"
      - "src/hoid/conversationHistoryStorePort.ts"
      - "src/hoid/conversationHistoryStorePort.test.ts"
      - "src/hoid/expoSqliteConversationHistoryStore.ts"
      - "src/hoid/expoSqliteConversationHistoryStore.test.ts"
      - "src/hoid/sharedSqliteDatabase.ts"
      - "src/hoid/sharedSqliteDatabase.test.ts"
      - "src/hoid/expoHoidDatabase.ts"
      - "src/hoid/expoCursorProgressCoordinator.ts"
      - "src/screens/HoidScreen.tsx"
      - "src/hoid/README.md"
      - "docs/hoid/SPOILER_SAFE_CONVERSATION_CONTINUITY.md"
      - "docs/hoid/RUN214_EXPLICIT_STATIC_GREETING_AND_FAIL_CLOSED_HISTORY.md"
      - "docs/hoid/RUN215_CANONICAL_STATIC_GREETING_INTEGRITY.md"
      - "docs/hoid/RUN216_VERSIONED_CONVERSATION_HISTORY_HYDRATION.md"
      - "docs/hoid/RUN217_PROVIDER_NEUTRAL_CONVERSATION_STORAGE_PORT.md"
      - "docs/hoid/RUN218_EXPO_SQLITE_CONVERSATION_HISTORY_ADAPTER.md"
      - "docs/hoid/RUN219_SHARED_EXPO_SQLITE_DATABASE_LIFECYCLE.md"
      - ".github/workflows/hoid-spoiler-safe-conversation-continuity.yml"

permissions:
  contents: read

jobs:
  conversation-continuity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test spoiler-safe conversation continuity and storage contracts
        run: >-
          npx vitest run
          src/hoid/coreferenceResolver.test.ts
          src/hoid/conversationContext.test.ts
          src/hoid/entityResolver.test.ts
          src/hoid/relationshipGateway.test.ts
          src/hoid/conversationGateway.test.ts
          src/hoid/conversationHistoryPolicy.test.ts
          src/hoid/conversationHistoryHydration.test.ts
          src/hoid/conversationHistoryStorePort.test.ts
          src/hoid/expoSqliteConversationHistoryStore.test.ts
          src/hoid/sharedSqliteDatabase.test.ts
      - name: Type-check continuity boundaries and storage composition
        run: >-
          npx tsc --noEmit --strict --target ES2020 --module commonjs
          --moduleResolution node --skipLibCheck --jsx react --esModuleInterop
          src/hoid/coreferenceRegistry.ts
          src/hoid/coreferenceResolver.ts
          src/hoid/conversationContext.ts
          src/hoid/entityResolver.ts
          src/hoid/relationshipGateway.ts
          src/hoid/conversationGateway.ts
          src/hoid/conversationHistoryPolicy.ts
          src/hoid/conversationHistoryHydration.ts
          src/hoid/conversationHistoryHydration.test.ts
          src/hoid/conversationHistoryStorePort.ts
          src/hoid/expoSqliteConversationHistoryStore.ts
          src/hoid/expoSqliteConversationHistoryStore.test.ts
          src/hoid/conversationHistoryStorePort.test.ts
          src/hoid/sharedSqliteDatabase.ts
          src/hoid/sharedSqliteDatabase.test.ts
          src/hoid/expoHoidDatabase.ts
          src/hoid/expoCursorProgressCoordinator.ts
          src/screens/HoidScreen.tsx
