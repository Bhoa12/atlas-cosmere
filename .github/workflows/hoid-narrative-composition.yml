name: Hoid narrative composition and provider-neutral layout

on:
  push:
    branches:
      - "feat/hoid-ia-core-run*"
    paths:
      - "src/hoid/narrativeComposition.ts"
      - "src/hoid/narrativeComposition.test.ts"
      - "src/hoid/relationshipPresentation.ts"
      - "src/hoid/relationshipPresentation.test.ts"
      - "src/hoid/relationshipGateway.ts"
      - "src/hoid/relationshipGateway.test.ts"
      - "src/hoid/conversationGateway.ts"
      - "src/hoid/conversationGateway.test.ts"
      - "src/hoid/README.md"
      - "docs/hoid/NARRATIVE_COMPOSITION_AND_LANGUAGE_PORT.md"
      - ".github/workflows/hoid-narrative-composition.yml"
  pull_request:
    paths:
      - "src/hoid/narrativeComposition.ts"
      - "src/hoid/narrativeComposition.test.ts"
      - "src/hoid/relationshipPresentation.ts"
      - "src/hoid/relationshipPresentation.test.ts"
      - "src/hoid/relationshipGateway.ts"
      - "src/hoid/relationshipGateway.test.ts"
      - "src/hoid/conversationGateway.ts"
      - "src/hoid/conversationGateway.test.ts"
      - "src/hoid/README.md"
      - "docs/hoid/NARRATIVE_COMPOSITION_AND_LANGUAGE_PORT.md"
      - ".github/workflows/hoid-narrative-composition.yml"

permissions:
  contents: read

jobs:
  narrative-composition:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test narrative composition and relationship presentation
        run: >-
          npx vitest run
          src/hoid/narrativeComposition.test.ts
          src/hoid/relationshipPresentation.test.ts
          src/hoid/relationshipGateway.test.ts
          src/hoid/conversationGateway.test.ts
      - name: Type-check narrative and evidence boundaries
        run: >-
          npx tsc --noEmit --strict --target ES2020 --module commonjs
          --moduleResolution node --skipLibCheck
          src/hoid/narrativeComposition.ts
          src/hoid/relationshipPresentation.ts
          src/hoid/relationshipGateway.ts
          src/hoid/conversationGateway.ts
