name: Hoid Run 332 — SQLite reader preference persistence

on:
  pull_request:
    paths:
      - "src/hoid/sqliteReaderRecommendationPreferencesStore.ts"
      - "src/hoid/sqliteReaderRecommendationPreferencesStore.test.ts"
      - "src/hoid/expoReaderRecommendationPreferencesStore.ts"
      - "src/hoid/readerRecommendationPreferences.ts"
      - "src/hoid/sqliteProgressStore.ts"
      - "src/hoid/expoHoidDatabase.ts"
      - "src/hoid/sharedSqliteDatabase.ts"
      - "src/components/HoidReaderPreferencesEditor.tsx"
      - "src/screens/HoidScreen.tsx"
      - "src/screens/HoidTrustedScreenHost.tsx"
      - "docs/hoid/RUN332_SQLITE_READER_PREFERENCES.md"
      - ".github/workflows/hoid-run332-sqlite-reader-preferences.yml"
  push:
    branches:
      - "feat/hoid-ia-core-run332"
    paths:
      - "src/hoid/sqliteReaderRecommendationPreferencesStore.ts"
      - "src/hoid/sqliteReaderRecommendationPreferencesStore.test.ts"
      - "src/hoid/expoReaderRecommendationPreferencesStore.ts"
      - "src/hoid/readerRecommendationPreferences.ts"
      - "src/hoid/sqliteProgressStore.ts"
      - "src/hoid/expoHoidDatabase.ts"
      - "src/hoid/sharedSqliteDatabase.ts"
      - "docs/hoid/RUN332_SQLITE_READER_PREFERENCES.md"
      - ".github/workflows/hoid-run332-sqlite-reader-preferences.yml"

permissions:
  contents: read

jobs:
  sqlite-reader-preferences:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test SQLite reader preference persistence
        run: npx vitest run src/hoid/sqliteReaderRecommendationPreferencesStore.test.ts src/hoid/readerRecommendationPreferences.test.ts
      - name: Strict type-check SQLite preference adapter
        run: >-
          npx tsc --noEmit --strict
          --target ES2022
          --module commonjs
          --moduleResolution node
          --esModuleInterop
          --allowSyntheticDefaultImports
          --jsx react-jsx
          --lib ES2022,DOM
          --skipLibCheck
          src/hoid/readerRecommendationPreferences.ts
          src/hoid/sqliteProgressStore.ts
          src/hoid/sharedSqliteDatabase.ts
          src/hoid/expoHoidDatabase.ts
          src/hoid/sqliteReaderRecommendationPreferencesStore.ts
          src/hoid/expoReaderRecommendationPreferencesStore.ts
          src/hoid/sqliteReaderRecommendationPreferencesStore.test.ts
          src/components/HoidReaderPreferencesEditor.tsx
          src/screens/HoidScreen.tsx
          src/screens/HoidTrustedScreenHost.tsx
