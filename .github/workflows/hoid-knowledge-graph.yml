name: Hoid authorized knowledge graph

on:
  push:
    branches:
      - "feat/hoid-ia-core-run*"
    paths:
      - "src/hoid/knowledgeGraph.ts"
      - "src/hoid/knowledgeGraph.test.ts"
      - "src/hoid/knowledgeGraphQuery.ts"
      - "src/hoid/knowledgeGraphQuery.test.ts"
      - "src/hoid/entityResolver.ts"
      - "src/hoid/entityResolver.test.ts"
      - "src/hoid/entityAliasRegistry.ts"
      - "src/hoid/conversationGateway.ts"
      - "src/hoid/conversationGateway.test.ts"
      - "src/hoid/conversationIntent.ts src/hoid/cursorReadingContext.ts"
      - "src/hoid/conversationIntent.test.ts src/hoid/cursorReadingContext.test.ts"
      - "src/hoid/cursorReadingContext.ts"
      - "src/hoid/cursorReadingContext.test.ts"
      - "src/screens/HoidScreen.tsx"
      - "src/context/CosmereContext.tsx"
      - "src/hoid/recommendations.ts"
      - "src/hoid/sha256.ts"
      - "src/hoid/editorialRegistry.ts"
      - "src/hoid/evidenceRuntime.ts"
      - "src/hoid/evidenceScope.ts"
      - "src/hoid/catalog.ts"
      - "src/hoid/cursorEvidenceRuntime.ts"
      - "src/hoid/cursorProgressLedger.ts"
      - "src/hoid/readingBoundary.ts"
      - "src/hoid/readingManifest.ts"
      - "src/hoid/verifiedChapterDocuments.ts"
      - "src/hoid/verifiedChapterLocators.ts"
      - "src/hoid/editionStructure.ts"
      - "src/hoid/editionProgressValidation.ts"
      - "src/hoid/readingValidation.ts"
      - "src/hoid/bibliography.ts"
      - "src/hoid/retrieval.ts"
      - "src/hoid/catalogValidation.ts"
      - "src/hoid/types.ts"
      - "docs/hoid/KNOWLEDGE_GRAPH_AUTHORIZATION.md"
      - "docs/hoid/KNOWLEDGE_GRAPH_QUERIES_AND_EXPLANATIONS.md"
      - "docs/hoid/ENTITY_RESOLUTION.md"
      - "docs/hoid/CONVERSATION_PROGRESS_FRESHNESS.md"
      - "docs/hoid/RECOMMENDATION_POLICY.md"
      - "docs/hoid/CONVERSATION_INTENT_ROUTING.md"
      - "docs/hoid/CURSOR_READING_CONTEXT.md"
      - ".github/workflows/hoid-knowledge-graph.yml"
  pull_request:
    paths:
      - "src/hoid/knowledgeGraph.ts"
      - "src/hoid/knowledgeGraph.test.ts"
      - "src/hoid/knowledgeGraphQuery.ts"
      - "src/hoid/knowledgeGraphQuery.test.ts"
      - "src/hoid/entityResolver.ts"
      - "src/hoid/entityResolver.test.ts"
      - "src/hoid/entityAliasRegistry.ts"
      - "src/hoid/conversationGateway.ts"
      - "src/hoid/conversationGateway.test.ts"
      - "src/hoid/conversationIntent.ts"
      - "src/hoid/conversationIntent.test.ts"
      - "src/hoid/cursorReadingContext.ts"
      - "src/hoid/cursorReadingContext.test.ts"
      - "src/screens/HoidScreen.tsx"
      - "src/context/CosmereContext.tsx"
      - "src/hoid/recommendations.ts"
      - "src/hoid/editorialRegistry.ts"
      - "src/hoid/evidenceRuntime.ts"
      - "src/hoid/evidenceScope.ts"
      - "src/hoid/catalog.ts"
      - "src/hoid/cursorEvidenceRuntime.ts"
      - "src/hoid/cursorProgressLedger.ts"
      - "src/hoid/readingBoundary.ts"
      - "src/hoid/readingManifest.ts"
      - "src/hoid/verifiedChapterDocuments.ts"
      - "src/hoid/verifiedChapterLocators.ts"
      - "src/hoid/editionStructure.ts"
      - "src/hoid/editionProgressValidation.ts"
      - "src/hoid/readingValidation.ts"
      - "src/hoid/bibliography.ts"
      - "src/hoid/retrieval.ts"
      - "src/hoid/catalogValidation.ts"
      - "src/hoid/types.ts"
      - "docs/hoid/KNOWLEDGE_GRAPH_AUTHORIZATION.md"
      - "docs/hoid/ENTITY_RESOLUTION.md"
      - "docs/hoid/CONVERSATION_PROGRESS_FRESHNESS.md"
      - "docs/hoid/RECOMMENDATION_POLICY.md"
      - "docs/hoid/CONVERSATION_INTENT_ROUTING.md"
      - "docs/hoid/CURSOR_READING_CONTEXT.md"
      - ".github/workflows/hoid-knowledge-graph.yml"

permissions:
  contents: read

jobs:
  authorized-knowledge-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test graph authorization and dependent spoiler boundaries
        run: npx vitest run src/hoid/knowledgeGraph.test.ts src/hoid/knowledgeGraphQuery.test.ts src/hoid/editorialClaimDrafts.test.ts src/hoid/evidenceRuntime.test.ts src/hoid/readingBoundary.test.ts src/hoid/cursorEvidenceRuntime.test.ts src/hoid/cursorProgressLedger.test.ts src/hoid/readingManifest.test.ts src/hoid/verifiedChapterDocuments.test.ts src/hoid/editorialRegistry.test.ts src/hoid/entityResolver.test.ts src/hoid/conversationGateway.test.ts src/hoid/conversationIntent.test.ts
      - name: Type-check graph and authorization dependencies
        run: npx tsc --noEmit --strict --target ES2020 --module commonjs --moduleResolution node --skipLibCheck src/hoid/knowledgeGraph.ts src/hoid/knowledgeGraphQuery.ts src/hoid/entityResolver.ts src/hoid/conversationGateway.ts src/hoid/conversationIntent.ts
