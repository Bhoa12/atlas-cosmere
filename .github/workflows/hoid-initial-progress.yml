name: Hoid initial progress safety

on:
  push:
    branches:
      - "feat/hoid-ia-core-run*"
    paths:
      - "src/hoid/initialProgress.ts"
      - "src/hoid/initialProgress.test.ts"
      - "src/hoid/progressAdapter.ts"
      - "src/context/CosmereContext.tsx"
      - "docs/hoid/INITIAL_PROGRESS_POLICY.md"
      - ".github/workflows/hoid-initial-progress.yml"
  pull_request:
    paths:
      - "src/hoid/initialProgress.ts"
      - "src/hoid/initialProgress.test.ts"
      - "src/hoid/progressAdapter.ts"
      - "src/context/CosmereContext.tsx"
      - "docs/hoid/INITIAL_PROGRESS_POLICY.md"
      - ".github/workflows/hoid-initial-progress.yml"

permissions:
  contents: read

jobs:
  initial-progress-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test fresh-profile progress
        run: npx vitest run src/hoid/initialProgress.test.ts src/hoid/progressAdapter.test.ts
      - name: Type-check progress boundary
        run: npx tsc --noEmit --strict --target ES2020 --module commonjs --moduleResolution node --skipLibCheck src/hoid/initialProgress.ts src/hoid/progressAdapter.ts
