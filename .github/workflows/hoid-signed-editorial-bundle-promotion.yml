name: Hoid signed editorial bundle promotion

on:
  push:
    branches:
      - "feat/hoid-ia-core-run*"
    paths:
      - "src/hoid/editorialReviewSignatures.ts"
      - "src/hoid/signedEditorialBundlePromotionAuthority.ts"
      - "src/hoid/signedEditorialBundlePromotionAuthority.test.ts"
      - "src/hoid/trustedHostPromotionAuthority.ts"
      - "src/hoid/trustedHostPromotionAuthority.test.ts"
      - "src/hoid/editorialReviewBundleQuorum.ts"
      - "src/hoid/editorialReviewBundleQuorum.test.ts"
      - "src/hoid/trustedHostBootstrap.ts"
      - "docs/hoid/RUN318_TRUSTED_HOST_QUORUM_GATE.md"
      - "src/hoid/editorialBundlePromotionAuthority.ts"
      - "src/hoid/editorialBundlePromotionAuthority.test.ts"
      - "src/hoid/editorialReviewBundle.ts"
      - "src/hoid/promotionReviewAuthority.ts"
      - "src/hoid/approvedClaimIntegrity.ts"
      - "src/hoid/readingManifest.ts"
      - "src/hoid/editionStructure.ts"
      - "docs/hoid/SIGNED_EDITORIAL_BUNDLE_PROMOTION.md"
      - ".github/workflows/hoid-signed-editorial-bundle-promotion.yml"
  pull_request:
    paths:
      - "src/hoid/editorialReviewSignatures.ts"
      - "src/hoid/signedEditorialBundlePromotionAuthority.ts"
      - "src/hoid/signedEditorialBundlePromotionAuthority.test.ts"
      - "src/hoid/trustedHostPromotionAuthority.ts"
      - "src/hoid/trustedHostPromotionAuthority.test.ts"
      - "src/hoid/editorialReviewBundleQuorum.ts"
      - "src/hoid/editorialReviewBundleQuorum.test.ts"
      - "src/hoid/trustedHostBootstrap.ts"
      - "docs/hoid/RUN318_TRUSTED_HOST_QUORUM_GATE.md"
      - "src/hoid/editorialBundlePromotionAuthority.ts"
      - "src/hoid/editorialBundlePromotionAuthority.test.ts"
      - "src/hoid/editorialReviewBundle.ts"
      - "src/hoid/promotionReviewAuthority.ts"
      - "src/hoid/approvedClaimIntegrity.ts"
      - "src/hoid/readingManifest.ts"
      - "src/hoid/editionStructure.ts"
      - "docs/hoid/SIGNED_EDITORIAL_BUNDLE_PROMOTION.md"
      - ".github/workflows/hoid-signed-editorial-bundle-promotion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-editorial-bundle-promotion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test signed bundle promotion and regressions
        run: >-
          npx vitest run
          src/hoid/signedEditorialBundlePromotionAuthority.test.ts
          src/hoid/trustedHostPromotionAuthority.test.ts
          src/hoid/editorialReviewBundleQuorum.test.ts
          src/hoid/editorialReviewSignatures.test.ts
          src/hoid/editorialBundlePromotionAuthority.test.ts
          src/hoid/editorialReviewBundle.test.ts
          src/hoid/promotionReviewAuthority.test.ts
      - name: Type-check signed promotion boundary
        run: >-
          npx tsc --noEmit --strict --target ES2020 --module commonjs
          --moduleResolution node --skipLibCheck
          src/hoid/signedEditorialBundlePromotionAuthority.ts
          src/hoid/trustedHostPromotionAuthority.ts
          src/hoid/editorialReviewBundleQuorum.ts
          src/hoid/trustedHostBootstrap.ts
          src/hoid/editorialReviewSignatures.ts
          src/hoid/editorialBundlePromotionAuthority.ts
          src/hoid/editorialReviewBundle.ts
          src/hoid/promotionReviewAuthority.ts
          src/hoid/githubSourceControlReviewAdapter.ts
          src/hoid/sqlitePromotionProgressAdapter.ts
          src/hoid/cursorEvidenceRuntime.ts
          src/hoid/knowledgeGraph.ts
          src/hoid/cursorProgressLedger.ts
          src/hoid/readingBoundary.ts
          src/hoid/progressLedger.ts
          src/hoid/sqliteProgressStore.ts
          src/hoid/sha256.ts
          src/hoid/editorialKnowledgeBundle.ts
          src/hoid/editorialClaimReviewPackets.ts
          src/hoid/editorialReviewPackets.ts
          src/hoid/editorialEntityDrafts.ts
          src/hoid/editorialRelationshipDrafts.ts
          src/hoid/editorialClaimDrafts.ts
          src/hoid/editorialDrafts.ts
          src/hoid/evidenceScope.ts
          src/hoid/editionProgressValidation.ts
          src/hoid/readingValidation.ts
          src/hoid/readingManifest.ts
          src/hoid/editionStructure.ts
          src/hoid/verifiedChapterLocators.ts
          src/hoid/verifiedChapterDocuments.ts
          src/hoid/bibliography.ts
          src/hoid/catalog.ts
          src/hoid/catalogValidation.ts
          src/hoid/readingContext.ts
          src/hoid/types.ts
