name: Hoid Run 373 — source access contract compatibility

on:
  pull_request:
    paths:
      - "src/hoid/editorialSourceDocumentAccess.ts"
      - "src/hoid/editorialSourceDocumentAccess.compatibility.test.ts"
      - "src/hoid/editorialClaimPromotionPreflight.ts"
      - "src/hoid/epubEditorialSourceCoverageAudit.ts"
      - "src/hoid/epubEditorialSourceCoverageAudit.test.ts"
      - "src/components/HoidEpubEditorialSourceAccessPanel.tsx"
      - "src/components/HoidEpubImportPanel.tsx"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/RUN373_SOURCE_ACCESS_CONTRACT_COMPATIBILITY.md"
      - ".github/workflows/hoid-run373-source-access-compatibility.yml"
  push:
    branches:
      - "feat/hoid-ia-core-run373"
    paths:
      - "src/hoid/editorialSourceDocumentAccess.ts"
      - "src/hoid/editorialSourceDocumentAccess.compatibility.test.ts"
      - "src/hoid/editorialClaimPromotionPreflight.ts"
      - "src/hoid/epubEditorialSourceCoverageAudit.ts"
      - "src/hoid/epubEditorialSourceCoverageAudit.test.ts"
      - "src/components/HoidEpubEditorialSourceAccessPanel.tsx"
      - "src/components/HoidEpubImportPanel.tsx"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/RUN373_SOURCE_ACCESS_CONTRACT_COMPATIBILITY.md"
      - ".github/workflows/hoid-run373-source-access-compatibility.yml"

permissions:
  contents: read

jobs:
  source-access-contract-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test canonical and compatibility contracts
        run: npx vitest run src/hoid/editorialSourceDocumentAccess.compatibility.test.ts
      - name: Strict TypeScript check across existing consumers
        run: >-
          npx tsc --noEmit --strict
          --target ES2020
          --module commonjs
          --moduleResolution node
          --skipLibCheck
          --esModuleInterop
          --jsx react-native
          src/hoid/editorialSourceDocumentAccess.compatibility.test.ts
          src/hoid/editorialClaimPromotionPreflight.ts
          src/hoid/editorialClaimPromotionPreflight.test.ts
          src/hoid/epubEditorialSourceCoverageAudit.ts
          src/hoid/epubEditorialSourceCoverageAudit.test.ts
          src/components/HoidEpubEditorialSourceAccessPanel.tsx
          src/components/HoidEpubImportPanel.tsx
          src/screens/HoidScreen.tsx
