name: Hoid Run 384 — magic-system application integration

on:
  pull_request:
    paths:
      - "src/hoid/conversationApplicationService.ts"
      - "src/hoid/magicSystemExplanation.ts"
      - "src/hoid/magicSystemExplanation.test.ts"
      - "src/hoid/magicSystemExplanationIntent.ts"
      - "src/hoid/magicSystemExplanationApplicationAdapter.ts"
      - "src/hoid/magicSystemExplanationApplicationAdapter.test.ts"
      - "src/hoid/conversationRouteExecution.ts"
      - "src/hoid/conversationRouteExecution.test.ts"
      - "src/hoid/conversationRoutePlan.ts"
      - "src/hoid/conversationRoutePlan.test.ts"
      - "src/hoid/trustedScreenIntegration.test.ts"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/RUN384_MAGIC_SYSTEM_APPLICATION_INTEGRATION.md"
      - ".github/workflows/hoid-run384-magic-system-application-integration.yml"
  push:
    branches:
      - "feat/hoid-ia-core-run384"
    paths:
      - "src/hoid/conversationApplicationService.ts"
      - "src/hoid/magicSystemExplanation.ts"
      - "src/hoid/magicSystemExplanation.test.ts"
      - "src/hoid/magicSystemExplanationIntent.ts"
      - "src/hoid/magicSystemExplanationApplicationAdapter.ts"
      - "src/hoid/magicSystemExplanationApplicationAdapter.test.ts"
      - "src/hoid/conversationRouteExecution.ts"
      - "src/hoid/conversationRouteExecution.test.ts"
      - "src/hoid/conversationRoutePlan.ts"
      - "src/hoid/conversationRoutePlan.test.ts"
      - "src/hoid/trustedScreenIntegration.test.ts"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/RUN384_MAGIC_SYSTEM_APPLICATION_INTEGRATION.md"
      - ".github/workflows/hoid-run384-magic-system-application-integration.yml"

permissions:
  contents: read

jobs:
  magic-system-application-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run magic-system and application regressions
        run: >-
          npx vitest run
          src/hoid/magicSystemExplanationApplicationAdapter.test.ts
          src/hoid/magicSystemExplanation.test.ts
          src/hoid/conversationApplicationService.test.ts
          src/hoid/conversationRouteExecution.test.ts
          src/hoid/conversationRoutePlan.test.ts
          src/hoid/trustedScreenIntegration.test.ts
      - name: Strict TypeScript check
        run: >-
          npx tsc --noEmit --strict
          --target ES2020
          --module es2020
          --moduleResolution node
          --skipLibCheck
          --esModuleInterop
          --jsx react-native
          src/hoid/conversationApplicationService.ts
          src/hoid/magicSystemExplanation.ts
          src/hoid/magicSystemExplanationIntent.ts
          src/hoid/magicSystemExplanationApplicationAdapter.ts
          src/hoid/magicSystemExplanationApplicationAdapter.test.ts
          src/hoid/conversationRouteExecution.ts
          src/hoid/conversationRoutePlan.ts
          src/hoid/trustedScreenIntegration.test.ts
          src/screens/HoidScreen.tsx
