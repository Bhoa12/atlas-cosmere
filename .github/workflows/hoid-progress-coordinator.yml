name: Hoid progress coordinator

on:
  push:
    branches:
      - "feat/hoid-ia-core-run*"
    paths:
      - "package.json"
      - "src/hoid/progressCoordinator.ts"
      - "src/hoid/progressCoordinator.test.ts"
      - "src/hoid/expoProgressCoordinator.ts"
      - "src/hoid/progressLedger.ts"
      - "src/hoid/sqliteProgressStore.ts"
      - "src/context/CosmereContext.tsx"
      - "src/screens/HoidScreen.tsx"
      - "App.tsx"
      - "docs/hoid/ATLAS_PROGRESS_PERSISTENCE.md"
      - ".github/workflows/hoid-progress-coordinator.yml"
  pull_request:
    paths:
      - "package.json"
      - "src/hoid/progressCoordinator.ts"
      - "src/hoid/progressCoordinator.test.ts"
      - "src/hoid/expoProgressCoordinator.ts"
      - "src/hoid/progressLedger.ts"
      - "src/hoid/sqliteProgressStore.ts"
      - "src/context/CosmereContext.tsx"
      - "src/screens/HoidScreen.tsx"
      - "App.tsx"
      - "docs/hoid/ATLAS_PROGRESS_PERSISTENCE.md"
      - ".github/workflows/hoid-progress-coordinator.yml"

permissions:
  contents: read

jobs:
  progress-coordinator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test Hoid progress and SQLite contracts
        run: npx vitest run src/hoid/progressCoordinator.test.ts src/hoid/progressLedger.test.ts src/hoid/sqliteProgressStore.test.ts src/hoid/initialProgress.test.ts
      - name: Type-check app integration
        run: npx tsc --noEmit --strict --target ES2020 --module commonjs --moduleResolution node --skipLibCheck --jsx react --esModuleInterop src/hoid/progressCoordinator.ts src/hoid/expoProgressCoordinator.ts src/context/CosmereContext.tsx src/screens/HoidScreen.tsx App.tsx
