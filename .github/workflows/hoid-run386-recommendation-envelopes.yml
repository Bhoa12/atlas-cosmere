name: Hoid Run 386 — progress-bound recommendation envelopes

on:
  pull_request:
    paths:
      - "src/hoid/recommendationEnvelope.ts"
      - "src/hoid/recommendationEnvelope.test.ts"
      - "src/hoid/recommendationDisplayProjection.ts"
      - "src/hoid/recommendationDisplayProjection.test.ts"
      - "src/hoid/curatedPathRecommendationDisplayProjection.ts"
      - "src/hoid/trustedCuratedPathRecommendationScreenPort.ts"
      - "src/hoid/editionBoundRecommendationPresentation.ts"
      - "src/hoid/editionBoundRecommendationNavigation.ts"
      - "src/hoid/readerRecommendationPreferences.ts"
      - "src/hoid/topicTaxonomy.ts"
      - "src/hoid/bibliography.ts"
      - "src/hoid/readingManifest.ts"
      - "src/hoid/sha256.ts"
      - "src/hoid/trustedScreenIntegration.test.ts"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/RUN386_RECOMMENDATION_ENVELOPES.md"
      - ".github/workflows/hoid-run386-recommendation-envelopes.yml"
  push:
    branches:
      - "feat/hoid-ia-core-run386"
    paths:
      - "src/hoid/recommendationEnvelope.ts"
      - "src/hoid/recommendationEnvelope.test.ts"
      - "src/hoid/recommendationDisplayProjection.ts"
      - "src/hoid/recommendationDisplayProjection.test.ts"
      - "src/hoid/curatedPathRecommendationDisplayProjection.ts"
      - "src/hoid/trustedCuratedPathRecommendationScreenPort.ts"
      - "src/hoid/editionBoundRecommendationPresentation.ts"
      - "src/hoid/editionBoundRecommendationNavigation.ts"
      - "src/hoid/readerRecommendationPreferences.ts"
      - "src/hoid/topicTaxonomy.ts"
      - "src/hoid/bibliography.ts"
      - "src/hoid/readingManifest.ts"
      - "src/hoid/sha256.ts"
      - "src/hoid/trustedScreenIntegration.test.ts"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/RUN386_RECOMMENDATION_ENVELOPES.md"
      - ".github/workflows/hoid-run386-recommendation-envelopes.yml"

permissions:
  contents: read

jobs:
  recommendation-envelopes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run recommendation and screen integration tests
        run: >-
          npx vitest run
          src/hoid/recommendationEnvelope.test.ts
          src/hoid/recommendationDisplayProjection.test.ts
          src/hoid/trustedScreenIntegration.test.ts
      - name: Strict TypeScript check
        run: >-
          npx tsc --noEmit --strict
          --target ES2020
          --module es2020
          --moduleResolution node
          --skipLibCheck
          --esModuleInterop
          --jsx react-native
          src/hoid/recommendationEnvelope.ts
          src/hoid/recommendationEnvelope.test.ts
          src/hoid/recommendationDisplayProjection.ts
          src/hoid/recommendationDisplayProjection.test.ts
          src/hoid/curatedPathRecommendationDisplayProjection.ts
          src/hoid/trustedCuratedPathRecommendationScreenPort.ts
          src/hoid/editionBoundRecommendationPresentation.ts
          src/hoid/editionBoundRecommendationNavigation.ts
          src/hoid/readerRecommendationPreferences.ts
          src/hoid/topicTaxonomy.ts
          src/hoid/bibliography.ts
          src/hoid/readingManifest.ts
          src/hoid/sha256.ts
          src/hoid/trustedScreenIntegration.test.ts
          src/screens/HoidScreen.tsx
