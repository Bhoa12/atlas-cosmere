name: Hoid chapter-scoped evidence retrieval

on:
  pull_request:
    paths:
      - "src/hoid/chapterEvidenceScope.ts"
      - "src/hoid/chapterEvidenceScope.test.ts"
      - "src/hoid/chapterReference.ts"
      - "src/hoid/answerScope.ts"
      - "src/hoid/conversationGateway.ts"
      - "src/hoid/conversationGateway.test.ts"
      - "src/hoid/typedConversationGateway.test.ts"
      - "src/hoid/cursorEvidenceRuntime.ts"
      - "src/hoid/cursorEvidenceRuntime.test.ts"
      - "src/hoid/evidenceRuntime.ts"
      - "src/hoid/evidenceRuntime.test.ts"
      - "src/hoid/retrieval.ts"
      - "src/hoid/retrieval.test.ts"
      - ".github/workflows/hoid-chapter-scoped-evidence-retrieval.yml"
  push:
    branches:
      - "feat/hoid-ia-core-run280"
    paths:
      - "src/hoid/chapterEvidenceScope.ts"
      - "src/hoid/chapterEvidenceScope.test.ts"
      - "src/hoid/chapterReference.ts"
      - "src/hoid/answerScope.ts"
      - "src/hoid/conversationGateway.ts"
      - "src/hoid/conversationGateway.test.ts"
      - "src/hoid/typedConversationGateway.test.ts"
      - "src/hoid/cursorEvidenceRuntime.ts"
      - "src/hoid/cursorEvidenceRuntime.test.ts"
      - "src/hoid/evidenceRuntime.ts"
      - "src/hoid/evidenceRuntime.test.ts"
      - "src/hoid/retrieval.ts"
      - "src/hoid/retrieval.test.ts"
      - ".github/workflows/hoid-chapter-scoped-evidence-retrieval.yml"

permissions:
  contents: read

jobs:
  chapter-scoped-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test chapter-scoped retrieval and spoiler boundaries
        run: npx vitest run src/hoid/chapterEvidenceScope.test.ts src/hoid/evidenceRuntime.test.ts src/hoid/cursorEvidenceRuntime.test.ts src/hoid/conversationGateway.test.ts src/hoid/typedConversationGateway.test.ts src/hoid/retrieval.test.ts
      - name: Strict type-check chapter-scoped retrieval
        run: npx tsc --noEmit --strict --target ES2022 --module commonjs --moduleResolution node --lib ES2022,DOM --skipLibCheck src/hoid/chapterEvidenceScope.ts src/hoid/evidenceRuntime.ts src/hoid/cursorEvidenceRuntime.ts src/hoid/conversationGateway.ts
