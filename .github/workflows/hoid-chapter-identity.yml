name: Hoid chapter identity

on:
  push:
    branches:
      - "feat/hoid-ia-core-run*"
    paths:
      - "src/hoid/chapterIdentity.ts"
      - "src/hoid/chapterIdentity.test.ts"
      - "src/hoid/readingManifest.ts"
      - "src/hoid/readingManifest.test.ts"
      - "src/hoid/evidenceScope.ts"
      - "src/hoid/evidenceScope.test.ts"
      - "src/hoid/editorialDrafts.ts"
      - "src/hoid/editorialDrafts.test.ts"
      - ".github/workflows/hoid-chapter-identity.yml"
  pull_request:
    paths:
      - "src/hoid/chapterIdentity.ts"
      - "src/hoid/chapterIdentity.test.ts"
      - "src/hoid/evidenceScope.ts"
      - "src/hoid/evidenceScope.test.ts"
      - "src/hoid/editorialDrafts.ts"
      - "src/hoid/editorialDrafts.test.ts"
      - ".github/workflows/hoid-chapter-identity.yml"

permissions:
  contents: read

jobs:
  chapter-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test chapter identity and editorial authorization
        run: npx vitest run src/hoid/chapterIdentity.test.ts src/hoid/readingManifest.test.ts src/hoid/evidenceScope.test.ts src/hoid/editorialDrafts.test.ts
      - name: Type-check chapter identity and editorial authorization
        run: npx tsc --noEmit --strict --target ES2020 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck src/hoid/chapterIdentity.ts src/hoid/readingManifest.ts src/hoid/evidenceScope.ts src/hoid/editorialDrafts.ts
