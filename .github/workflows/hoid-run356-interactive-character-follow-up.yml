name: Hoid Run 356 — interactive progress-bound character follow-up

on:
  push:
    branches:
      - "feat/hoid-ia-core-run356"
    paths:
      - "src/hoid/entityEvolutionExplanation.ts"
      - "src/hoid/entityEvolutionExplanation.test.ts"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/RUN356_INTERACTIVE_CHARACTER_FOLLOW_UP.md"
      - ".github/workflows/hoid-run356-interactive-character-follow-up.yml"
  pull_request:
    paths:
      - "src/hoid/entityEvolutionExplanation.ts"
      - "src/hoid/entityEvolutionExplanation.test.ts"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/RUN356_INTERACTIVE_CHARACTER_FOLLOW_UP.md"
      - ".github/workflows/hoid-run356-interactive-character-follow-up.yml"

permissions:
  contents: read

jobs:
  interactive-character-follow-up:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run character evolution and follow-up tests
        run: >-
          npx vitest run
          src/hoid/entityEvolutionExplanation.test.ts
          src/hoid/entityEvolutionExplanationIntent.test.ts
          src/hoid/entityDossierConversation.test.ts
          src/hoid/entityRelationshipConversation.test.ts
          src/hoid/entityProgressTimeline.test.ts
          src/hoid/magicSystemExplanation.test.ts
          src/hoid/answerDisplayProjection.test.ts
      - name: Strict TypeScript check
        run: >-
          npx tsc --noEmit --strict
          --target ES2020
          --module commonjs
          --moduleResolution node
          --skipLibCheck
          --esModuleInterop
          --jsx react-native
          src/hoid/entityEvolutionExplanation.ts
          src/hoid/entityEvolutionExplanation.test.ts
          src/hoid/entityEvolutionExplanationIntent.ts
          src/hoid/entityEvolutionExplanationIntent.test.ts
          src/screens/HoidScreen.tsx
