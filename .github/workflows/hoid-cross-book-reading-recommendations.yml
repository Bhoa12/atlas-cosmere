name: Hoid cross-book evidence and reading-aware recommendations

on:
  push:
    branches:
      - "feat/hoid-ia-core-run*"
    paths:
      - "src/hoid/crossBookEvidence.ts"
      - "src/hoid/crossBookEvidence.test.ts"
      - "src/hoid/readingAwareRecommendations.ts"
      - "src/hoid/readingAwareRecommendations.test.ts"
      - "src/hoid/recommendations.ts"
      - "src/hoid/cursorEvidenceRuntime.ts"
      - "src/hoid/cursorEvidenceRuntime.test.ts"
      - "src/hoid/conversationGateway.ts"
      - "src/hoid/conversationGateway.test.ts"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/CROSS_BOOK_EVIDENCE_AND_READING_AWARE_RECOMMENDATIONS.md"
      - "docs/hoid/RECOMMENDATION_POLICY.md"
      - "docs/hoid/RUN227_MANIFEST_BOUND_READING_AWARE_RECOMMENDATIONS.md"
      - ".github/workflows/hoid-cross-book-reading-recommendations.yml"
  pull_request:
    paths:
      - "src/hoid/crossBookEvidence.ts"
      - "src/hoid/crossBookEvidence.test.ts"
      - "src/hoid/readingAwareRecommendations.ts"
      - "src/hoid/readingAwareRecommendations.test.ts"
      - "src/hoid/recommendations.ts"
      - "src/hoid/cursorEvidenceRuntime.ts"
      - "src/hoid/cursorEvidenceRuntime.test.ts"
      - "src/hoid/conversationGateway.ts"
      - "src/hoid/conversationGateway.test.ts"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/CROSS_BOOK_EVIDENCE_AND_READING_AWARE_RECOMMENDATIONS.md"
      - "docs/hoid/RECOMMENDATION_POLICY.md"
      - "docs/hoid/RUN227_MANIFEST_BOUND_READING_AWARE_RECOMMENDATIONS.md"
      - ".github/workflows/hoid-cross-book-reading-recommendations.yml"

permissions:
  contents: read

jobs:
  cross-book-and-recommendations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test cross-book provenance and reading-aware recommendations
        run: >-
          npx vitest run
          src/hoid/crossBookEvidence.test.ts
          src/hoid/answerPresentation.test.ts
          src/hoid/readingAwareRecommendations.test.ts
          src/hoid/cursorEvidenceRuntime.test.ts
          src/hoid/conversationGateway.test.ts
      - name: Type-check runtime, recommendations and HoidScreen
        run: >-
          npx tsc --noEmit --strict --target ES2020 --module commonjs
          --moduleResolution node --skipLibCheck --jsx react --esModuleInterop
          src/hoid/crossBookEvidence.ts
          src/hoid/readingAwareRecommendations.ts
          src/hoid/cursorEvidenceRuntime.ts
          src/hoid/conversationGateway.ts
          src/screens/HoidScreen.tsx
