name: Hoid explicit topic interests and safe recommendations

on:
  push:
    branches:
      - "feat/hoid-ia-core-run*"
    paths:
      - "src/hoid/topicInterestContext.ts"
      - "src/hoid/topicInterestContext.test.ts"
      - "src/hoid/topicInterestRecommendationsGateway.ts"
      - "src/hoid/topicInterestRecommendationsGateway.test.ts"
      - "src/hoid/topicApprovedClaimAnswerPort.ts"
      - "src/hoid/topicApprovedClaimAnswerPort.test.ts"
      - "src/hoid/trustedTopicRecommendations.ts"
      - "src/hoid/trustedTopicRecommendations.test.ts"
      - "src/hoid/trustedScreenAnswer.ts"
      - "src/hoid/evidenceRuntime.ts"
      - "src/hoid/evidenceRuntime.test.ts"
      - "src/hoid/cursorEvidenceRuntime.ts"
      - "src/hoid/cursorEvidenceRuntime.test.ts"
      - "src/hoid/answerPresentation.ts"
      - "src/hoid/answerPresentation.test.ts"
      - "src/hoid/readingManifest.ts"
      - "src/hoid/readingBoundary.ts"
      - "src/hoid/cursorProgressLedger.ts"
      - "src/hoid/evidenceScope.ts"
      - "src/hoid/sha256.ts"
      - "src/hoid/topicRecommendations.ts"
      - "src/hoid/topicRecommendations.test.ts"
      - "src/hoid/topicTaxonomy.ts"
      - "src/hoid/knowledgeGraph.test.ts"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/EXPLICIT_TOPIC_INTERESTS.md"
      - "docs/hoid/LOCAL_APPROVED_CLAIM_RENDERING.md"
      - "docs/hoid/CURSOR_NATIVE_RECOMMENDATION_ASSURANCE.md"
      - "docs/hoid/RUN202_TRUSTED_TOPIC_RECOMMENDATION_PRESENTATION.md"
      - "src/hoid/README.md"
      - ".github/workflows/hoid-explicit-topic-interests.yml"
  pull_request:
    paths:
      - "src/hoid/topicInterestContext.ts"
      - "src/hoid/topicInterestContext.test.ts"
      - "src/hoid/topicInterestRecommendationsGateway.ts"
      - "src/hoid/topicInterestRecommendationsGateway.test.ts"
      - "src/hoid/topicApprovedClaimAnswerPort.ts"
      - "src/hoid/topicApprovedClaimAnswerPort.test.ts"
      - "src/hoid/trustedTopicRecommendations.ts"
      - "src/hoid/trustedTopicRecommendations.test.ts"
      - "src/hoid/trustedScreenAnswer.ts"
      - "src/hoid/evidenceRuntime.ts"
      - "src/hoid/evidenceRuntime.test.ts"
      - "src/hoid/cursorEvidenceRuntime.ts"
      - "src/hoid/cursorEvidenceRuntime.test.ts"
      - "src/hoid/answerPresentation.ts"
      - "src/hoid/answerPresentation.test.ts"
      - "src/hoid/readingManifest.ts"
      - "src/hoid/readingBoundary.ts"
      - "src/hoid/cursorProgressLedger.ts"
      - "src/hoid/evidenceScope.ts"
      - "src/hoid/sha256.ts"
      - "src/hoid/topicRecommendations.ts"
      - "src/hoid/topicRecommendations.test.ts"
      - "src/hoid/topicTaxonomy.ts"
      - "src/hoid/knowledgeGraph.test.ts"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/EXPLICIT_TOPIC_INTERESTS.md"
      - "docs/hoid/LOCAL_APPROVED_CLAIM_RENDERING.md"
      - "docs/hoid/CURSOR_NATIVE_RECOMMENDATION_ASSURANCE.md"
      - "docs/hoid/RUN202_TRUSTED_TOPIC_RECOMMENDATION_PRESENTATION.md"
      - "src/hoid/README.md"
      - ".github/workflows/hoid-explicit-topic-interests.yml"

permissions:
  contents: read

jobs:
  explicit-topic-interests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test cursor-native topic rendering and recommendation safety
        run: >-
          npx vitest run
          src/hoid/topicInterestContext.test.ts
          src/hoid/topicInterestRecommendationsGateway.test.ts
          src/hoid/topicApprovedClaimAnswerPort.test.ts
          src/hoid/trustedTopicRecommendations.test.ts
          src/hoid/evidenceRuntime.test.ts
          src/hoid/cursorEvidenceRuntime.test.ts
          src/hoid/answerPresentation.test.ts
          src/hoid/topicRecommendations.test.ts
          src/hoid/topicTaxonomy.test.ts
          src/hoid/knowledgeGraph.test.ts
      - name: Type-check strict application boundaries
        run: >-
          npx tsc --noEmit --strict --target ES2020 --module commonjs
          --moduleResolution node --skipLibCheck --jsx react --esModuleInterop
          src/hoid/topicInterestContext.ts
          src/hoid/topicInterestRecommendationsGateway.ts
          src/hoid/topicApprovedClaimAnswerPort.ts
          src/hoid/trustedTopicRecommendations.ts
          src/hoid/evidenceRuntime.ts
          src/hoid/cursorEvidenceRuntime.ts
          src/hoid/answerPresentation.ts
          src/hoid/topicRecommendations.ts
          src/hoid/topicTaxonomy.ts
          src/hoid/knowledgeGraph.ts
          src/screens/HoidScreen.tsx
