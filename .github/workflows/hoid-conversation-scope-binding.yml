name: Hoid evidence-bound conversation scope

on:
  push:
    branches:
      - "feat/hoid-ia-core-run*"
    paths:
      - "src/hoid/conversationScopeBinding.ts"
      - "src/hoid/conversationScopeBinding.test.ts"
      - "src/hoid/conversationGateway.ts"
      - "src/hoid/conversationGateway.test.ts"
      - "src/hoid/typedConversationGateway.test.ts"
      - "src/hoid/conversationContext.ts"
      - "src/hoid/typedConversationContext.ts"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/RUN265_EVIDENCE_BOUND_CONVERSATION_SCOPE.md"
      - ".github/workflows/hoid-conversation-scope-binding.yml"
  pull_request:
    paths:
      - "src/hoid/conversationScopeBinding.ts"
      - "src/hoid/conversationScopeBinding.test.ts"
      - "src/hoid/conversationGateway.ts"
      - "src/hoid/conversationGateway.test.ts"
      - "src/hoid/typedConversationGateway.test.ts"
      - "src/hoid/conversationContext.ts"
      - "src/hoid/typedConversationContext.ts"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/RUN265_EVIDENCE_BOUND_CONVERSATION_SCOPE.md"
      - ".github/workflows/hoid-conversation-scope-binding.yml"

permissions:
  contents: read

jobs:
  conversation-scope-binding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test evidence-bound conversation scope and follow-up routing
        run: >-
          npx vitest run
          src/hoid/conversationScopeBinding.test.ts
          src/hoid/conversationGateway.test.ts
          src/hoid/typedConversationGateway.test.ts
          src/hoid/conversationContext.test.ts
          src/hoid/typedConversationContext.test.ts
          src/hoid/answerScope.test.ts
          src/hoid/answerPresentation.test.ts
      - name: Strict type-check gateway, binding and screen
        run: >-
          npx tsc --noEmit --strict --target ES2020 --module commonjs
          --moduleResolution node --skipLibCheck --jsx react-native --esModuleInterop
          src/hoid/conversationScopeBinding.ts
          src/hoid/conversationScopeBinding.test.ts
          src/hoid/conversationGateway.ts
          src/hoid/conversationGateway.test.ts
          src/hoid/typedConversationGateway.test.ts
          src/hoid/conversationContext.ts
          src/hoid/typedConversationContext.ts
          src/screens/HoidScreen.tsx
