name: Hoid exact-unit spoiler dependency runtime

on:
  pull_request:
    paths:
      - "src/hoid/exactUnitSpoilerDependencyGate.ts"
      - "src/hoid/exactUnitSpoilerDependencyGate.test.ts"
      - "src/hoid/exactUnitEvidenceRuntime.ts"
      - "src/hoid/exactUnitEvidenceRuntime.test.ts"
      - "src/hoid/trustedExactUnitAnswerHost.ts"
      - "src/hoid/trustedExactUnitAnswerHost.test.ts"
      - "src/hoid/unitEvidenceAuthorizationV2.ts"
      - "src/hoid/unitProgressLedger.ts"
      - "src/hoid/unitProgressCursor.ts"
      - "src/hoid/chapterReference.ts"
      - "docs/hoid/RUN323_EXACT_UNIT_SPOILER_DEPENDENCY_RUNTIME.md"
      - ".github/workflows/hoid-exact-unit-spoiler-dependency-runtime.yml"

permissions:
  contents: read

jobs:
  exact-unit-spoiler-dependency-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test exact-unit dependency gate and answer-runtime regressions
        run: >-
          npx vitest run
          src/hoid/exactUnitSpoilerDependencyGate.test.ts
          src/hoid/exactUnitEvidenceRuntime.test.ts
          src/hoid/unitEvidenceAuthorizationV2.test.ts
          src/hoid/exactUnitClaimIntegrity.test.ts
          src/hoid/trustedExactUnitAnswerHost.test.ts
      - name: Strict type-check provider boundary and exact progress gate
        run: >-
          npx tsc --noEmit --strict
          --target ES2022
          --module commonjs
          --moduleResolution node
          --lib ES2022,DOM
          --skipLibCheck
          src/hoid/exactUnitSpoilerDependencyGate.ts
          src/hoid/exactUnitSpoilerDependencyGate.test.ts
          src/hoid/exactUnitEvidenceRuntime.ts
          src/hoid/exactUnitEvidenceRuntime.test.ts
          src/hoid/trustedExactUnitAnswerHost.ts
