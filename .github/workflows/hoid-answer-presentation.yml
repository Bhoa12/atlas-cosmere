name: Hoid source-aware answer presentation

on:
  push:
    branches:
      - "feat/hoid-ia-core-run*"
    paths:
      - "src/hoid/answerPresentation.ts"
      - "src/hoid/answerPresentation.test.ts"
      - "src/hoid/bibliography.ts"
      - "src/hoid/cursorEvidenceRuntime.ts"
      - "src/hoid/readingManifest.ts"
      - "src/hoid/evidenceScope.ts"
      - "src/hoid/evidenceRuntime.ts"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/RUN126_SOURCE_AWARE_ANSWER_PRESENTATION.md"
      - "src/hoid/README.md"
      - ".github/workflows/hoid-answer-presentation.yml"
  pull_request:
    paths:
      - "src/hoid/answerPresentation.ts"
      - "src/hoid/answerPresentation.test.ts"
      - "src/hoid/bibliography.ts"
      - "src/hoid/cursorEvidenceRuntime.ts"
      - "src/hoid/readingManifest.ts"
      - "src/hoid/evidenceScope.ts"
      - "src/hoid/evidenceRuntime.ts"
      - "src/screens/HoidScreen.tsx"
      - "docs/hoid/RUN126_SOURCE_AWARE_ANSWER_PRESENTATION.md"
      - "src/hoid/README.md"
      - ".github/workflows/hoid-answer-presentation.yml"

permissions:
  contents: read

jobs:
  source-aware-answer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test source-aware answer presentation
        run: npx vitest run src/hoid/answerPresentation.test.ts
      - name: Type-check presentation boundary and dependencies
        run: npx tsc --noEmit --strict --target ES2020 --module commonjs --moduleResolution node --skipLibCheck src/hoid/answerPresentation.ts
