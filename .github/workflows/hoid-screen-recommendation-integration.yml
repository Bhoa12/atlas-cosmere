name: Hoid screen recommendation integration

on:
  push:
    branches:
      - "feat/hoid-ia-core-run*"
    paths:
      - "src/screens/HoidScreen.tsx"
      - "src/hoid/editionBoundRecommendationPresentation.ts"
      - "src/hoid/editionBoundRecommendationPresentation.test.ts"
      - "src/hoid/editionBoundRecommendationFreshness.ts"
      - "src/hoid/editionBoundRecommendationFreshness.test.ts"
      - "docs/hoid/RUN254_RECOMMENDATION_FRESHNESS_GATE.md"
      - "src/hoid/editionBoundRecommendationExplanations.ts"
      - "src/hoid/editionBoundRecommendations.ts"
      - "src/hoid/cursorProgressLedger.ts"
      - "src/hoid/readingManifest.ts"
      - "src/hoid/knowledgeGraph.ts"
      - ".github/workflows/hoid-screen-recommendation-integration.yml"
      - "docs/hoid/RUN236_SCREEN_RECOMMENDATION_INTEGRATION.md"
      - "docs/hoid/RUN237_RECOMMENDATION_PRESENTATION_TEST_REPAIR.md"
  pull_request:
    paths:
      - "src/screens/HoidScreen.tsx"
      - "src/hoid/editionBoundRecommendationPresentation.ts"
      - "src/hoid/editionBoundRecommendationPresentation.test.ts"
      - "src/hoid/editionBoundRecommendationFreshness.ts"
      - "src/hoid/editionBoundRecommendationFreshness.test.ts"
      - "docs/hoid/RUN254_RECOMMENDATION_FRESHNESS_GATE.md"
      - "src/hoid/editionBoundRecommendationExplanations.ts"
      - "src/hoid/editionBoundRecommendations.ts"
      - "src/hoid/cursorProgressLedger.ts"
      - "src/hoid/readingManifest.ts"
      - "src/hoid/knowledgeGraph.ts"
      - ".github/workflows/hoid-screen-recommendation-integration.yml"
      - "docs/hoid/RUN236_SCREEN_RECOMMENDATION_INTEGRATION.md"
      - "docs/hoid/RUN237_RECOMMENDATION_PRESENTATION_TEST_REPAIR.md"

permissions:
  contents: read

jobs:
  screen-recommendation-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test recommendation presentation and progress contracts
        run: >-
          npx vitest run
          src/hoid/editionBoundRecommendationPresentation.test.ts
          src/hoid/editionBoundRecommendationFreshness.test.ts
          src/hoid/editionBoundRecommendations.test.ts
          src/hoid/editionBoundRecommendationExplanations.test.ts
          src/hoid/cursorProgressLedger.test.ts
          src/hoid/readingManifest.test.ts
      - name: Strict type-check recommendation adapter and screen
        run: >-
          npx tsc --noEmit --strict --target ES2020 --module commonjs
          --moduleResolution node --skipLibCheck --jsx react-native
          --esModuleInterop
          src/screens/HoidScreen.tsx
          src/hoid/editionBoundRecommendationPresentation.ts
          src/hoid/editionBoundRecommendationFreshness.ts
          src/hoid/editionBoundRecommendations.ts
          src/hoid/editionBoundRecommendationExplanations.ts
          src/hoid/cursorProgressLedger.ts
          src/hoid/readingManifest.ts
