name: Hoid crash-resumable history migration runner

on:
  push:
    branches:
      - "feat/hoid-ia-core-run303"
    paths:
      - "src/hoid/conversationHistoryAuthorityJournal.ts"
      - "src/hoid/conversationHistoryAuthorityJournal.test.ts"
      - "src/hoid/conversationHistoryMigrationRunner.ts"
      - "src/hoid/conversationHistoryMigrationRunner.test.ts"
      - "docs/hoid/RUN303_MIGRATION_RUNNER.md"
      - ".github/workflows/hoid-history-migration-runner.yml"
  pull_request:
    paths:
      - "src/hoid/conversationHistoryAuthorityJournal.ts"
      - "src/hoid/conversationHistoryAuthorityJournal.test.ts"
      - "src/hoid/conversationHistoryMigrationRunner.ts"
      - "src/hoid/conversationHistoryMigrationRunner.test.ts"
      - "docs/hoid/RUN303_MIGRATION_RUNNER.md"
      - ".github/workflows/hoid-history-migration-runner.yml"

permissions:
  contents: read

jobs:
  migration-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test migration protocol and runner
        run: >-
          npx vitest run
          src/hoid/conversationHistoryAuthorityJournal.test.ts
          src/hoid/conversationHistoryMigrationRunner.test.ts
      - name: Type-check journal, runner and tests
        run: >-
          npx tsc --noEmit --strict --target ES2020 --module commonjs
          --moduleResolution node --esModuleInterop --skipLibCheck
          src/hoid/conversationHistoryAuthorityJournal.ts
          src/hoid/conversationHistoryAuthorityJournal.test.ts
          src/hoid/conversationHistoryMigrationRunner.ts
          src/hoid/conversationHistoryMigrationRunner.test.ts
