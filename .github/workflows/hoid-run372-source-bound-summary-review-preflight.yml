name: Hoid Run 372 — source-bound summary review preflight

on:
  pull_request:
    paths:
      - "src/hoid/editorialSummaryPromotionPreflight.ts"
      - "src/hoid/editorialSummaryPromotionPreflight.test.ts"
      - "src/hoid/editorialSourceDocumentAccess.ts"
      - "src/hoid/editorialSummaryReviewQueue.ts"
      - "src/hoid/editorialReviewWorkflow.ts"
      - "src/hoid/editorialReviewReceiptStore.ts"
      - "src/hoid/editorialReviewPackets.ts"
      - "src/hoid/epubEditorialSourceAccess.ts"
      - "src/hoid/editorialClaimPromotionPreflight.ts"
      - "src/hoid/cursorEvidenceRuntime.ts"
      - "docs/hoid/RUN372_SOURCE_BOUND_SUMMARY_REVIEW_PREFLIGHT.md"
      - ".github/workflows/hoid-run372-source-bound-summary-review-preflight.yml"
  push:
    branches:
      - "feat/hoid-ia-core-run372"
    paths:
      - "src/hoid/editorialSummaryPromotionPreflight.ts"
      - "src/hoid/editorialSummaryPromotionPreflight.test.ts"
      - "src/hoid/editorialSourceDocumentAccess.ts"
      - "src/hoid/editorialSummaryReviewQueue.ts"
      - "src/hoid/editorialReviewWorkflow.ts"
      - "src/hoid/editorialReviewReceiptStore.ts"
      - "src/hoid/editorialReviewPackets.ts"
      - "src/hoid/epubEditorialSourceAccess.ts"
      - "src/hoid/editorialClaimPromotionPreflight.ts"
      - "src/hoid/cursorEvidenceRuntime.ts"
      - "docs/hoid/RUN372_SOURCE_BOUND_SUMMARY_REVIEW_PREFLIGHT.md"
      - ".github/workflows/hoid-run372-source-bound-summary-review-preflight.yml"

permissions:
  contents: read

jobs:
  source-bound-summary-review-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test source-bound editorial summary preflight
        run: >-
          npx vitest run
          src/hoid/editorialSummaryPromotionPreflight.test.ts
          src/hoid/editorialReviewWorkflow.test.ts
          src/hoid/editorialSummaryReviewQueue.test.ts
          src/hoid/editorialReviewPackets.test.ts
          src/hoid/sqliteEditorialReviewReceiptStore.test.ts
          src/hoid/epubEditorialSourceAccess.test.ts
          src/hoid/cursorEvidenceRuntime.test.ts
      - name: Strict TypeScript check
        run: >-
          npx tsc --noEmit --strict
          --target ES2022
          --module commonjs
          --moduleResolution node
          --esModuleInterop
          --allowSyntheticDefaultImports
          --jsx react-jsx
          --lib ES2022,DOM
          --skipLibCheck
          src/hoid/editorialSummaryPromotionPreflight.ts
          src/hoid/editorialSummaryPromotionPreflight.test.ts
          src/hoid/editorialSourceDocumentAccess.ts
          src/hoid/editorialReviewWorkflow.ts
          src/hoid/editorialSummaryReviewQueue.ts
          src/hoid/editorialReviewReceiptStore.ts
          src/hoid/editorialReviewPackets.ts
          src/hoid/epubEditorialSourceAccess.ts
          src/hoid/editorialClaimPromotionPreflight.ts
          src/hoid/cursorEvidenceRuntime.ts
