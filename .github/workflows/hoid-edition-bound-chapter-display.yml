name: Hoid edition-bound chapter identity display

on:
  push:
    branches:
      - "feat/hoid-ia-core-run*"
    paths:
      - "src/hoid/verifiedChapterLocators.ts"
      - "src/hoid/readingManifest.ts"
      - "src/hoid/readingManifest.test.ts"
      - "src/hoid/chapterIdentity.ts"
      - "src/hoid/chapterIdentity.test.ts"
      - "src/hoid/evidenceScope.ts"
      - "src/hoid/evidenceScope.test.ts"
      - "src/hoid/answerDisplayProjection.ts"
      - "src/hoid/answerDisplayProjection.test.ts"
      - "src/hoid/recommendationDisplayProjection.ts"
      - "src/hoid/recommendationDisplayProjection.test.ts"
      - "src/screens/HoidScreen.tsx"
      - "src/hoid/trustedScreenIntegration.test.ts"
      - ".github/workflows/hoid-edition-bound-chapter-display.yml"
  pull_request:
    paths:
      - "src/hoid/verifiedChapterLocators.ts"
      - "src/hoid/readingManifest.ts"
      - "src/hoid/readingManifest.test.ts"
      - "src/hoid/chapterIdentity.ts"
      - "src/hoid/chapterIdentity.test.ts"
      - "src/hoid/evidenceScope.ts"
      - "src/hoid/evidenceScope.test.ts"
      - "src/hoid/answerDisplayProjection.ts"
      - "src/hoid/answerDisplayProjection.test.ts"
      - "src/hoid/recommendationDisplayProjection.ts"
      - "src/hoid/recommendationDisplayProjection.test.ts"
      - "src/screens/HoidScreen.tsx"
      - "src/hoid/trustedScreenIntegration.test.ts"
      - ".github/workflows/hoid-edition-bound-chapter-display.yml"

permissions:
  contents: read

jobs:
  chapter-identity-display:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test exact chapter identities and display projections
        run: >-
          npx vitest run
          src/hoid/readingManifest.test.ts
          src/hoid/chapterIdentity.test.ts
          src/hoid/evidenceScope.test.ts
          src/hoid/answerDisplayProjection.test.ts
          src/hoid/recommendationDisplayProjection.test.ts
          src/hoid/trustedScreenIntegration.test.ts
      - name: Type-check chapter identity and screen integration
        run: >-
          npx tsc --noEmit --strict --target ES2020
          --module commonjs --moduleResolution node --jsx react-native
          --esModuleInterop --skipLibCheck
          src/hoid/verifiedChapterLocators.ts
          src/hoid/readingManifest.ts
          src/hoid/chapterIdentity.ts
          src/hoid/evidenceScope.ts
          src/hoid/answerDisplayProjection.ts
          src/hoid/recommendationDisplayProjection.ts
          src/screens/HoidScreen.tsx
