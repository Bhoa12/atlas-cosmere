name: Hoid explanation depth policy

on:
  push:
    branches:
      - "feat/hoid-ia-core-run*"
    paths:
      - "src/hoid/explanationDepth.ts"
      - "src/hoid/explanationDepth.test.ts"
      - "src/hoid/answerPresentation.ts"
      - "src/hoid/narrativeComposition.ts"
      - "src/hoid/evidenceScope.ts"
      - "src/hoid/readingManifest.ts"
      - "docs/hoid/EXPLANATION_DEPTH_POLICY.md"
      - ".github/workflows/hoid-explanation-depth.yml"
  pull_request:
    paths:
      - "src/hoid/explanationDepth.ts"
      - "src/hoid/explanationDepth.test.ts"
      - "src/hoid/answerPresentation.ts"
      - "src/hoid/narrativeComposition.ts"
      - "src/hoid/evidenceScope.ts"
      - "src/hoid/readingManifest.ts"
      - "docs/hoid/EXPLANATION_DEPTH_POLICY.md"
      - ".github/workflows/hoid-explanation-depth.yml"

permissions:
  contents: read

jobs:
  explanation-depth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test explanation depth and source-aware presentation
        run: >-
          npx vitest run
          src/hoid/explanationDepth.test.ts
          src/hoid/answerPresentation.test.ts
      - name: Type-check provider-neutral explanation boundary
        run: >-
          npx tsc --noEmit --strict --target ES2020 --module commonjs
          --moduleResolution node --skipLibCheck
          src/hoid/explanationDepth.ts
